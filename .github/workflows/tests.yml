name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host-side and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"  # the image's python3, which runs the root helpers
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The installer itself: the uv environment with the test tools, Playwright's Chromium, and
      # the web UI's pages (web/dist), which src/server/server.py serves.
      - run: ./install.sh --yes --dev --no-launchers
      - run: uv run playwright install-deps chromium  # tests/test_web_ui.py
      - run: uv run pytest -q -rs tests  # -rs: say why a test was skipped (no browser, no node)

  image:
    name: Image boot tests (${{ matrix.agent }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, copilot]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      # No ENABLED_PLUGINS build arg: every plugin's install.sh runs, so each one is exercised.
      - run: docker build -t claude-agent:${{ matrix.agent }} --build-arg AGENT=${{ matrix.agent }} .
      - run: uv run pytest -q tests/e2e
        env:
          SANDBOX_E2E_IMAGE: claude-agent:${{ matrix.agent }}
          SANDBOX_E2E_AGENT: ${{ matrix.agent }}
