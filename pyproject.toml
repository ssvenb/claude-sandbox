[project]
name = "claude-sandbox"
version = "0.1.0"
description = "A Docker sandbox for running CLI coding agents autonomously, with a web UI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "google-auth[requests]>=2.50.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.32.5",
    "uvicorn>=0.39.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.45",  # tests/test_web_ui.py; then `uv run playwright install chromium`
]

[tool.uv]
package = false  # an application run from its checkout (run.sh, src/server/server.py), not a library

[tool.pytest.ini_options]
testpaths = ["tests"]
