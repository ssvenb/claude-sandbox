<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Session</title>
<link id="icon" rel="icon">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<style>
  /* A session's conversation: the header says which and how it is doing, the column is what was
     said and done, the dock at the bottom is where the next message is written. The dock is
     there from the first moment, while the sandbox still starts. */
  body { height: 100dvh; display: flex; flex-direction: column; background: var(--panel); }
  header { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--rule);
           background: var(--page); min-width: 0; }
  header .home { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
                 color: var(--muted); flex: none; }
  header .home:hover { color: var(--ink); background: var(--sunk); }
  header .home svg { width: 18px; height: 18px; }
  header .who { flex: 1; min-width: 0; display: grid; }
  header .who b { font-size: 16px; font-weight: 650; letter-spacing: -.01em; line-height: 1.25;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .who span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .state { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 9px; border-radius: 999px;
                  font-size: 13px; font-weight: 550; background: var(--sunk); white-space: nowrap; flex: none; }
  header .state.working, header .state.starting { background: var(--lamp-wash); color: var(--lamp); }
  header .state.question { background: var(--ask-wash); color: var(--ask); }
  header .state.idle { background: var(--ok-wash); color: var(--ok); }
  header .chips { display: flex; gap: 6px; min-width: 0; overflow: hidden; }

  #scroll { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: auto; overscroll-behavior: contain; }
  .column { width: min(820px, 100%); margin: 0 auto; padding: 0 20px; }
  #log { padding-top: 22px; padding-bottom: 26px; display: flex; flex-direction: column; gap: 14px; }

  /* The sandbox starting: a turning ring, the step it is on, the whole output on request. */
  .boot { border: 1px solid var(--rule); border-radius: 12px; background: var(--sunk); font-size: 14px; }
  .boot > summary { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; list-style: none; min-width: 0; }
  .boot > summary::-webkit-details-marker { display: none; }
  .boot .step { font-weight: 600; white-space: nowrap; }
  .boot .line { flex: 1; min-width: 0; color: var(--muted); font-family: var(--mono); font-size: 12px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .boot .mark { width: 16px; text-align: center; font-weight: 700; flex: none; }
  .boot.ok .mark { color: var(--ok); }
  .boot.failed { border-color: color-mix(in srgb, var(--fail) 50%, transparent); }
  .boot.failed .mark, .boot.failed .step { color: var(--fail); }
  .boot.starting .mark { color: var(--lamp); }
  .boot pre { margin: 0; padding: 10px 14px 12px; border-top: 1px solid var(--rule); max-height: 44vh; overflow: auto;
              font-size: 12px; line-height: 1.5; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .boot.quiet { border-color: transparent; background: transparent; }
  .boot.quiet > summary { padding: 0 2px; color: var(--muted); }
  .boot.quiet .step { font-weight: 400; }
  .boot.quiet[open] { border-color: var(--rule); background: var(--sunk); }
  .boot.quiet[open] > summary { padding: 9px 14px; }

  /* What you said: set off to the right, on the lamp's wash. Still waiting for the sandbox: dashed. */
  .you { align-self: flex-end; max-width: min(86%, 640px); padding: 9px 14px; border-radius: 16px 16px 4px 16px;
         background: var(--lamp-wash); white-space: pre-wrap; overflow-wrap: anywhere; }
  .you.queued { background: transparent; border: 1px dashed var(--muted); }

  /* What the agent wrote: prose, set like prose. */
  .say { line-height: 1.6; overflow-wrap: anywhere; min-width: 0; }
  .say > :first-child { margin-top: 0; }
  .say > :last-child { margin-bottom: 0; }
  .say p { margin: 0 0 .7em; }
  .say h1, .say h2, .say h3, .say h4 { margin: 1.1em 0 .4em; line-height: 1.25; letter-spacing: -.012em; font-weight: 650; }
  .say h1 { font-size: 22px; } .say h2 { font-size: 19px; } .say h3 { font-size: 16.5px; } .say h4 { font-size: 15px; }
  .say ul, .say ol { margin: 0 0 .7em; padding-left: 1.4em; }
  .say li { margin: .15em 0; }
  .say li > ul, .say li > ol { margin: .15em 0 0; }
  .say blockquote { margin: 0 0 .7em; padding: 2px 0 2px 14px; border-left: 3px solid var(--rule); color: var(--muted); }
  .say hr { border: 0; border-top: 1px solid var(--rule); margin: 1em 0; }
  .say code { padding: 1px 5px; border-radius: 5px; background: var(--sunk); border: 1px solid var(--rule); }
  .say a { text-underline-offset: 2px; }
  .say .scroller { overflow-x: auto; margin: 0 0 .8em; }
  .say table { border-collapse: collapse; font-size: 14px; }
  .say th, .say td { padding: 5px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
  .say th { font-weight: 600; border-bottom-color: var(--muted); }
  .code { position: relative; margin: 0 0 .8em; border: 1px solid var(--rule); border-radius: 10px; background: var(--sunk); }
  .code pre { margin: 0; padding: 11px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; }
  .code pre code { padding: 0; border: 0; background: none; font-size: inherit; }
  .code .lang { position: absolute; top: 5px; right: 62px; color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .code .copy { position: absolute; top: 4px; right: 5px; padding: 0 8px; font-size: 11px; line-height: 20px; color: var(--muted);
                border-color: transparent; background: var(--sunk); }
  .code .copy:hover { color: var(--ink); border-color: var(--rule); }
  .caret::after { content: ""; display: inline-block; width: .5em; height: 1em; margin-left: 2px; vertical-align: -.15em;
                  background: var(--lamp); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* What it thought before it spoke: folded away, there to read. */
  .think { color: var(--muted); font-size: 13.5px; }
  .think > summary { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; list-style: none; }
  .think > summary::-webkit-details-marker { display: none; }
  .think > summary svg { width: 12px; height: 12px; transition: transform .12s; }
  .think[open] > summary svg { transform: rotate(90deg); }
  .think > div { margin-top: 6px; padding-left: 14px; border-left: 2px solid var(--rule); white-space: pre-wrap; overflow-wrap: anywhere; }

  /* What it did: one line per tool call, runs of them in one box. Open a line for what went in
     and what came back. */
  .tools { border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .tool + .tool { border-top: 1px solid var(--rule); }
  .tool > summary { display: flex; align-items: center; gap: 9px; padding: 6px 12px; cursor: pointer; list-style: none;
                    font-size: 13.5px; min-width: 0; }
  .tool > summary::-webkit-details-marker { display: none; }
  .tool > summary:hover { background: var(--sunk); }
  .tool .mark { width: 14px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--ok); }
  .tool.running .mark { color: var(--lamp); }
  .tool.failed .mark { color: var(--fail); }
  .tool .verb { font-weight: 600; white-space: nowrap; flex: none; }
  .tool .what { flex: 1; min-width: 0; color: var(--muted); font-family: var(--mono); font-size: 12px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .took { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .tool .body { padding: 2px 12px 12px 35px; display: grid; gap: 8px; min-width: 0; }
  .tool .body .label { color: var(--muted); font-size: 12px; margin-bottom: -4px; }
  .tool pre { margin: 0; padding: 9px 11px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--rule);
              font-size: 12px; line-height: 1.5; max-height: 340px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tool pre.err { border-color: color-mix(in srgb, var(--fail) 45%, transparent); }
  .diff { padding: 6px 0 !important; white-space: pre !important; overflow-wrap: normal !important; }
  .diff span { display: block; padding: 0 11px; min-width: max-content; }
  .diff .add { background: var(--add); }
  .diff .del { background: var(--del); }
  .diff .add::before { content: "+ "; color: var(--ok); }
  .diff .del::before { content: "− "; color: var(--fail); }
  .diff .same::before { content: "  "; }
  .diff .gap { color: var(--muted); }
  /* What a subagent said and did, inside the call that started it. */
  .kids { display: grid; gap: 8px; padding-left: 10px; border-left: 2px solid var(--rule); font-size: 13.5px; min-width: 0; }
  .kids:empty { display: none; }
  .kids .say { color: var(--muted); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13.5px; }
  .steps li { display: flex; gap: 8px; align-items: baseline; }
  .steps .box { width: 14px; flex: none; text-align: center; color: var(--muted); }
  .steps .done { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
  .steps .done .box { color: var(--ok); text-decoration: none; }
  .steps .active { font-weight: 600; }
  .steps .active .box { color: var(--lamp); }

  /* Notes from the session itself: a turn ended, something went wrong, it is over. */
  .turn { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .turn::before, .turn::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
  .note { padding: 8px 12px; border-radius: 10px; font-size: 13.5px; background: var(--sunk); color: var(--muted); white-space: pre-wrap;
          overflow-wrap: anywhere; }
  .note.warning { background: var(--lamp-wash); color: var(--ink); }
  .note.error { background: var(--fail-wash); color: var(--ink); border: 1px solid color-mix(in srgb, var(--fail) 40%, transparent); }
  .over { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--sunk); }
  .over b { font-weight: 600; }
  .over span { flex: 1; color: var(--muted); min-width: 12ch; }

  /* A question of the agent's: it waits for this, so it is the loudest thing in the column. */
  .ask { border: 1.5px solid var(--ask); border-radius: 14px; padding: 14px 16px; display: grid; gap: 14px; background: var(--ask-wash); }
  .ask.settled { border: 1px solid var(--rule); background: transparent; color: var(--muted); gap: 6px; padding: 10px 14px; }
  .ask .q { display: grid; gap: 8px; }
  .ask .q > b { font-weight: 600; font-size: 15.5px; }
  .ask .q > small { color: var(--ask); font-weight: 600; font-size: 12px; }
  .ask .plan { padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); max-height: 50vh; overflow: auto; }
  .ask .options { display: grid; gap: 6px; }
  .ask .options button { display: grid; gap: 1px; text-align: left; border-radius: 10px; padding: 7px 12px; background: var(--panel); }
  .ask .options button span { color: var(--muted); font-size: 13px; }
  .ask .options button[aria-pressed=true] { border-color: var(--ask); box-shadow: inset 0 0 0 1px var(--ask); }
  .ask .other { display: flex; gap: 8px; }
  .ask .other input { flex: 1; min-width: 0; background: var(--panel); }
  .ask .row { display: flex; gap: 8px; justify-content: flex-end; }
  .ask.settled .said { color: var(--ink); }

  /* The dock: the plan it works through, a suggestion, and the composer. */
  #dock { border-top: 1px solid var(--rule); background: var(--page); padding: 10px 0 max(14px, env(safe-area-inset-bottom)); }
  #dock .column { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  #plan { border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); font-size: 13.5px; }
  #plan > summary { display: flex; align-items: center; gap: 9px; padding: 6px 12px; cursor: pointer; list-style: none; min-width: 0; }
  #plan > summary::-webkit-details-marker { display: none; }
  #plan > summary b { font-weight: 600; flex: none; }
  #plan > summary span { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #plan > summary i { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  #plan .steps { padding: 4px 12px 10px; max-height: 30vh; overflow: auto; }
  #suggest { justify-self: start; max-width: 100%; display: inline-flex; gap: 8px; align-items: baseline; border-style: dashed;
             color: var(--muted); border-radius: 10px; text-align: left; }
  #suggest kbd { font-size: 11px; padding: 0 5px; border: 1px solid var(--rule); border-radius: 4px; }
  #suggest span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .composer { position: relative; border: 1.5px solid var(--rule); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); }
  .composer:focus-within { border-color: var(--lamp); }
  .composer textarea { display: block; width: 100%; min-height: 48px; max-height: 40vh; resize: none; border: 0; outline: 0 !important;
                       background: transparent; padding: 13px 16px 4px; font-size: 15px; line-height: 1.5; }
  .composer .bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px 8px 10px; min-width: 0; }
  .composer .bar select { border-color: transparent; background: transparent; color: var(--muted); font-size: 13px; padding: 3px 4px;
                          max-width: 190px; min-width: 0; text-overflow: ellipsis; cursor: pointer; }
  .composer .bar select:hover { color: var(--ink); background: var(--sunk); }
  .composer .bar .hint { flex: 1; }
  .composer .bar button.round { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; flex: none; }
  .composer .bar button.round svg { width: 18px; height: 18px; }
  .composer .bar button.halt { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 50%, transparent); }
  /* Its commands, as you type a slash. */
  #menu { position: absolute; left: 8px; right: 8px; bottom: calc(100% + 6px); max-height: 46vh; overflow-y: auto; padding: 5px;
          border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); z-index: 5; }
  #menu button { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 5px 9px; }
  #menu button b { font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; }
  #menu button i { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  #menu button span { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu button[aria-selected=true] { background: var(--lamp-wash); }

  #gone { flex: 1; display: grid; place-content: center; text-align: center; color: var(--muted); padding: 24px; }
  #gone b { display: block; color: var(--ink); font-size: 22px; font-weight: 650; margin-bottom: 6px; }
  #gone[hidden] { display: none; }

  @media (max-width: 720px) {
    header { padding: 8px 10px; gap: 6px; }
    header .chips, header .theme { display: none; }
    .column { padding: 0 12px; }
    .you { max-width: 94%; }
    .tool .body { padding-left: 12px; }
    .composer .bar select { max-width: 120px; }
    .composer textarea { font-size: 16px; }  /* smaller, and a phone zooms in on focus */
    #log { padding-top: 14px; gap: 12px; }
    .ask { padding: 12px; }
    .code .lang { display: none; }
  }
  /* On a touch screen Enter starts a new line and the button sends; there is no Tab to take a suggestion with. */
  @media (pointer: coarse) {
    #suggest kbd { display: none; }
    .composer .bar { justify-content: space-between; }
    .composer .bar select { flex: 0 1 auto; }
    .composer .bar button.round { width: 40px; height: 40px; margin-left: auto; }
    .composer .bar button.halt { margin-left: auto; }
    .composer .bar button.halt + button.round { margin-left: 0; }
    .tool > summary { padding: 9px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .caret::after { animation: none; } }
</style>
</head>
<body>
<header id="bar"></header>
<div id="gone" hidden><div><b>Session gone</b><a href="/">Dashboard</a></div></div>
<main id="scroll">
  <div class="column">
    <div id="log" aria-live="polite"></div>
  </div>
</main>
<footer id="dock"><div class="column">
  <details id="plan" hidden></details>
  <button id="suggest" type="button" hidden></button>
  <form class="composer" id="composer">
    <div id="menu" role="listbox" hidden></div>
    <textarea id="input" rows="1" aria-label="Message to the agent" autocomplete="off"></textarea>
    <div class="bar">
      <select id="model" aria-label="Model" hidden></select>
      <select id="effort" aria-label="Reasoning effort" hidden></select>
      <span class="hint"></span>
      <button class="round halt" id="halt" type="button" title="Interrupt (Esc)" aria-label="Interrupt" hidden></button>
      <button class="round primary" id="send" type="submit" aria-label="Send"></button>
    </div>
  </form>
</div></footer>
<script>
let id = location.hash.slice(1);
$('icon').href = FAVICON.starting;
const scroller = $('scroll'), log = $('log'), input = $('input');
$('send').append(ICON.send());
$('halt').append(ICON.stop());

// ---- markdown, built as elements (never innerHTML: it is the agent's text, and other people's) --

const SAFE = /^(https?:|mailto:)/i;
function inline(text, into) {
  // code spans first, then links, bold, italics, strikethrough, bare URLs
  const re = /(`+)([\s\S]*?)\1|\[([^\]\n]+)\]\(([^)\s]+)\)|\*\*([^\n]+?)\*\*|(?<![\w*])\*(?!\s)([^*\n]+?)(?<!\s)\*(?![\w*])|(?<![\w_])_(?!\s)([^_\n]+?)(?<!\s)_(?![\w_])|~~([^\n]+?)~~|(https?:\/\/[^\s<>)\]]+[^\s<>)\].,;:!?'"])/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) into.append(text.slice(last, m.index));
    last = re.lastIndex;
    if (m[1]) into.append(h('code', {}, m[2].trim()));
    else if (m[3]) {
      if (SAFE.test(m[4])) into.append(inline(m[3], h('a', {href: m[4], target: '_blank', rel: 'noopener noreferrer'})));
      else into.append(m[0]);
    } else if (m[5]) into.append(inline(m[5], h('strong')));
    else if (m[6] || m[7]) into.append(inline(m[6] || m[7], h('em')));
    else if (m[8]) into.append(inline(m[8], h('s')));
    else into.append(h('a', {href: m[9], target: '_blank', rel: 'noopener noreferrer'}, m[9]));
  }
  if (last < text.length) into.append(text.slice(last));
  return into;
}

async function copy(text, button) {
  try { await navigator.clipboard.writeText(text); }
  catch {  // no Clipboard API off localhost over plain http: the old way, through a textarea
    const area = h('textarea', {value: text});
    document.body.append(area);
    area.select();
    document.execCommand('copy');
    area.remove();
  }
  if (button) { button.textContent = 'Copied'; setTimeout(() => { button.textContent = 'Copy'; }, 1200); }
}
const codeBlock = (text, lang) => {
  const button = h('button', {type: 'button', className: 'copy', onclick: () => copy(text, button)}, 'Copy');
  return h('div', {className: 'code'}, lang ? h('span', {className: 'lang'}, lang) : '', button, h('pre', {}, h('code', {}, text)));
};

const ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const cells = line => line.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => c.trim().replaceAll('\\|', '|'));
function markdown(text, into) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  let i = 0;
  const para = [];
  const flush = () => { if (para.length) into.append(inline(para.join('\n'), h('p'))); para.length = 0; };
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = /^\s*(```+|~~~+)\s*([\w+#.-]*)/.exec(line))) {  // fenced code, to its closing fence or the end
      flush();
      const body = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith(m[1]); i++) body.push(lines[i]);
      i++;
      into.append(codeBlock(body.join('\n'), m[2]));
    } else if (!line.trim()) { flush(); i++; }
    else if ((m = /^(#{1,6})\s+(.*?)\s*#*$/.exec(line))) { flush(); into.append(inline(m[2], h('h' + Math.min(4, m[1].length)))); i++; }
    else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); into.append(h('hr')); i++; }
    else if (/^\s*>/.test(line)) {
      flush();
      const body = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) body.push(lines[i].replace(/^\s*>\s?/, ''));
      into.append(markdown(body.join('\n'), h('blockquote')));
    } else if (line.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      flush();
      const head = cells(line), body = [];
      for (i += 2; i < lines.length && lines[i].includes('|') && lines[i].trim(); i++) body.push(cells(lines[i]));
      into.append(h('div', {className: 'scroller'}, h('table', {},
        h('thead', {}, h('tr', {}, ...head.map(c => inline(c, h('th'))))),
        h('tbody', {}, ...body.map(row => h('tr', {}, ...head.map((_, k) => inline(row[k] || '', h('td')))))))));
    } else if ((m = ITEM.exec(line))) {
      flush();
      i = list(lines, i, m[1].length, into);
    } else { para.push(line); i++; }
  }
  flush();
  return into;
}
// A list: its items at one indent, whatever is indented further belongs to the item above it.
function list(lines, i, indent, into) {
  const ordered = /\d/.test(ITEM.exec(lines[i])[2]);
  const el = h(ordered ? 'ol' : 'ul');
  if (ordered) el.start = parseInt(ITEM.exec(lines[i])[2], 10);
  while (i < lines.length) {
    const m = ITEM.exec(lines[i]);
    if (!m || m[1].length < indent || (m[1].length === indent && /\d/.test(m[2]) !== ordered)) break;
    if (m[1].length > indent) { i = list(lines, i, m[1].length, el.lastElementChild || el); continue; }
    const body = [m[3]];
    for (i++; i < lines.length && lines[i].trim() && !ITEM.test(lines[i]) && !/^\s*(```|~~~)/.test(lines[i]); i++) body.push(lines[i].trim());
    const task = /^\[([ xX])\]\s+/.exec(body[0]);
    const li = h('li');
    if (task) { li.append(h('input', {type: 'checkbox', checked: task[1] !== ' ', disabled: true}), ' '); body[0] = body[0].slice(task[0].length); }
    el.append(inline(body.join('\n'), li));
    while (i < lines.length && !lines[i].trim() && i + 1 < lines.length && ITEM.test(lines[i + 1]) && ITEM.exec(lines[i + 1])[1].length >= indent) i++;
  }
  into.append(el);
  return i;
}

// ---- a tool call, in a few words ----------------------------------------------------------------

const VERBS = {bash: 'Run', shell: 'Run', powershell: 'Run', read: 'Read', view: 'Read', edit: 'Edit', multiedit: 'Edit', str_replace: 'Edit',
  str_replace_editor: 'Edit', write: 'Write', create: 'Write', grep: 'Search', glob: 'Find files', ls: 'List', webfetch: 'Fetch',
  web_fetch: 'Fetch', fetch: 'Fetch', websearch: 'Search the web', web_search: 'Search the web', task: 'Subagent', agent: 'Subagent',
  todowrite: 'Plan', update_todo: 'Plan', skill: 'Skill', askuserquestion: 'Ask', ask_user: 'Ask', exitplanmode: 'Propose plan',
  notebookedit: 'Edit notebook', toolsearch: 'Find tools', report_intent: 'Intent'};
function verb(tool) {
  if (tool.title) return tool.title;
  const mcp = /^mcp__(.+?)__(.+)$/.exec(tool.name || '');
  if (mcp) return `${mcp[1]}: ${mcp[2].replaceAll('_', ' ')}`;
  return VERBS[String(tool.name).toLowerCase()] || String(tool.name);
}
function what(input) {
  if (!input || typeof input !== 'object') return '';
  for (const key of ['command', 'file_path', 'notebook_path', 'pattern', 'query', 'url', 'path', 'skill', 'description', 'intent', 'prompt'])
    if (typeof input[key] === 'string' && input[key].trim())
      return input[key].trim().split('\n')[0] + (key === 'pattern' && input.path ? `  in ${input.path}` : '');
  const first = Object.values(input).find(v => typeof v === 'string' && v.trim());
  return first ? first.trim().split('\n')[0] : '';
}

// Lines that left and lines that came, in order, with a little of what stayed around them.
function diff(before, after) {
  const a = before.replace(/\n$/, '').split('\n'), b = after.replace(/\n$/, '').split('\n');
  let rows;
  if (a.length * b.length > 250000) rows = [...a.map(t => ['del', t]), ...b.map(t => ['add', t])];
  else {
    const lcs = Array.from({length: a.length + 1}, () => new Uint16Array(b.length + 1));
    for (let x = a.length - 1; x >= 0; x--)
      for (let y = b.length - 1; y >= 0; y--)
        lcs[x][y] = a[x] === b[y] ? lcs[x + 1][y + 1] + 1 : Math.max(lcs[x + 1][y], lcs[x][y + 1]);
    rows = [];
    let x = 0, y = 0;
    while (x < a.length || y < b.length) {
      if (x < a.length && y < b.length && a[x] === b[y]) { rows.push(['same', a[x]]); x++; y++; }
      else if (y >= b.length || (x < a.length && lcs[x + 1][y] >= lcs[x][y + 1])) rows.push(['del', a[x++]]);
      else rows.push(['add', b[y++]]);
    }
  }
  const keep = rows.map((r, k) => r[0] !== 'same' || rows.slice(Math.max(0, k - 2), k + 3).some(n => n[0] !== 'same'));
  const pre = h('pre', {className: 'diff'});
  rows.forEach((r, k) => {
    if (keep[k]) pre.append(h('span', {className: r[0]}, r[1] || ' '));
    else if (keep[k - 1] !== false) pre.append(h('span', {className: 'gap'}, '  ⋯'));
  });
  return pre;
}
const steps = items => h('ul', {className: 'steps'}, ...items.map(t => h('li', {className: t.status},
  h('span', {className: 'box'}, t.status === 'done' ? '✓' : t.status === 'active' ? h('span', {className: 'spin'}) : '○'), h('span', {}, t.text))));
const todoItems = input => (input?.todos || []).map(t => ({text: t.content || t.title || '',
  status: {in_progress: 'active', completed: 'done', done: 'done'}[t.status] || 'pending'}));

// ---- the column ---------------------------------------------------------------------------------

let session = null, info = {}, status = 'starting', ready = false, over = null, lastState = '';
let blocks = new Map(), tools = new Map(), asks = new Map(), users = new Map(), boot = null;
let follow = true;  // keep the newest line in view, until the reader scrolls up
scroller.addEventListener('scroll', () => { follow = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80; });
const settle = () => { if (follow) scroller.scrollTop = scroller.scrollHeight; };
new ResizeObserver(settle).observe(log);

// Where an event's element goes: inside the subagent call it belongs to, else at the column's end.
function place(el, parent) {
  (tools.get(parent)?.kids || log).append(el);
  return el;
}

function bootLine(text) {
  if (!boot) {
    const el = h('details', {className: 'boot starting'});
    boot = {el, mark: h('span', {className: 'mark'}, h('span', {className: 'spin'})), step: h('span', {className: 'step'}, 'Starting the sandbox'),
            line: h('span', {className: 'line'}), pre: h('pre')};
    el.append(h('summary', {}, boot.mark, boot.step, boot.line), boot.pre);
    log.prepend(el);
  }
  if (text) {
    boot.pre.append(text + '\n');
    boot.line.textContent = text.split('\n').filter(Boolean).pop() || '';
    if (boot.el.open) boot.pre.scrollTop = boot.pre.scrollHeight;
  }
}
function bootState() {
  if (!boot) return;
  const failed = over !== null && !ready;
  boot.el.className = 'boot ' + (failed ? 'failed' : ready ? 'ok quiet' : 'starting');
  boot.mark.replaceChildren(failed ? '✕' : ready ? '✓' : h('span', {className: 'spin'}));
  boot.step.textContent = failed ? 'Sandbox failed' : ready ? 'Sandbox ready' : info.agent ? 'Starting the agent' : 'Starting the sandbox';
  if (failed) boot.el.open = true;
  if (ready) boot.line.textContent = '';
}

function user(e) {
  const el = place(h('div', {className: 'you' + (e.queued ? ' queued' : '')}, e.text));
  if (e.id) users.set(e.id, el);
  if (session && !session.title) session.title = e.text.replace(/\s+/g, ' ').slice(0, 140);  // it is called what it was first asked
  follow = true;
}
function sent(e) {
  const el = users.get(e.id);
  el?.classList.remove('queued');
}

// A block of text, whole or still streaming: drawn at most once a frame.
function draw(b) {
  if (b.dirty) return;
  b.dirty = true;
  requestAnimationFrame(() => {
    b.dirty = false;
    if (b.kind === 'thinking') {
      b.body.textContent = b.text;
      b.label.replaceChildren(b.streaming ? h('span', {className: 'spin'}) : '', b.streaming ? ' Thinking' : 'Thought');
    } else {
      b.body.replaceChildren();
      markdown(b.text, b.body);
      b.body.lastElementChild?.classList.toggle('caret', !!b.streaming && !b.body.lastElementChild.matches('.code, .scroller'));
    }
    settle();
  });
}
// A block streams until its whole text comes, or until anything else does: not every block gets
// its whole text sent (thinking may come only as a stream), and it must not turn for ever.
function settleBlocks(except) {
  for (const b of blocks.values()) if (b.streaming && b !== except) { b.streaming = false; draw(b); }
}
function block(e, streaming) {
  let b = blocks.get(e.id);
  if (!b) {
    b = {text: '', kind: e.kind, dirty: false};
    if (e.kind === 'thinking') {
      b.label = h('span', {}, 'Thinking');
      b.body = h('div');
      b.el = h('details', {className: 'think'}, h('summary', {}, ICON.chevron(), b.label), b.body);
    } else b.el = b.body = h('div', {className: 'say'});
    blocks.set(e.id, b);
    place(b.el, e.parent);
  }
  settleBlocks(b);
  b.text = streaming ? b.text + e.text : e.text;
  b.streaming = streaming;
  draw(b);
}

function tool(e) {
  let t = tools.get(e.id);
  if (!t) {
    t = {mark: h('span', {className: 'mark'}), verb: h('span', {className: 'verb'}), what: h('span', {className: 'what'}),
         took: h('span', {className: 'took'}), given: h('div'), kids: h('div', {className: 'kids'}), out: h('div')};
    t.el = h('details', {className: 'tool running'}, h('summary', {}, t.mark, t.verb, t.what, t.took),
             h('div', {className: 'body'}, t.given, t.kids, t.out));
    tools.set(e.id, t);
    const into = tools.get(e.parent)?.kids || log;
    let box = into.lastElementChild;
    if (!box?.classList.contains('tools')) box = place(h('div', {className: 'tools'}), e.parent);
    box.append(t.el);
  }
  Object.assign(t, {name: e.name ?? t.name, title: e.title ?? t.title, input: e.input ?? t.input});
  t.verb.textContent = verb(t);
  t.what.textContent = what(t.input);
  const i = t.input;
  if (typeof i?.description === 'string') t.what.title = i.description;
  if (i && typeof i === 'object') {
    const before = i.old_string ?? i.old_str, after = i.new_string ?? i.new_str, written = i.content ?? i.file_text;
    const parts = [];
    if (i.todos) parts.push(steps(todoItems(i)));
    else if (typeof before === 'string' && typeof after === 'string') parts.push(diff(before, after));
    else if (typeof written === 'string' && (i.file_path || i.path)) parts.push(h('pre', {}, written));
    else if (typeof i.command === 'string') parts.push(h('pre', {}, i.command));
    else if (typeof i.prompt === 'string') parts.push(h('pre', {}, i.prompt));
    else if (Object.keys(i).length) parts.push(h('pre', {}, JSON.stringify(i, null, 2)));
    t.given.replaceChildren(...parts);
  }
  if (e.done !== undefined || e.output !== undefined) result(e);
  else toolState(t);
}
function toolState(t) {
  t.el.className = 'tool ' + (t.done ? (t.error ? 'failed' : 'done') : 'running');
  t.mark.replaceChildren(t.done ? (t.error ? '✕' : '✓') : h('span', {className: 'spin'}));
  if (t.done) t.took.textContent = '';
}
function result(e) {
  const t = tools.get(e.id);
  if (!t) return;
  t.done = e.done ?? !e.partial;
  t.error = !!e.error;
  const text = String(e.output ?? '').replace(/\s+$/, '');
  t.out.replaceChildren(...(text ? [h('pre', {className: t.error ? 'err' : ''}, text)] : []));
  toolState(t);
}
function progress(e) {
  const t = tools.get(e.id);
  if (!t || t.done) return;
  if (e.seconds) t.took.textContent = e.seconds >= 60 ? `${Math.floor(e.seconds / 60)} min ${e.seconds % 60} s` : `${e.seconds} s`;
  if (e.text) t.what.textContent = e.text;
}

// A question it waits on. One question with one choice answers on the click; anything more is
// collected and sent together.
function ask(e) {
  const el = place(h('div', {className: 'ask'}));
  const a = {el, e, picked: e.questions.map(() => new Set()), other: e.questions.map(() => '')};
  asks.set(e.id, a);
  if (e.done || e.answers !== undefined) return settled(a, e.answers);
  const single = e.questions.length === 1 && !e.questions[0].multi;
  const answers = () => Object.fromEntries(e.questions.map((q, k) =>
    [q.question, [...a.picked[k], ...(a.other[k].trim() ? [a.other[k].trim()] : [])].join(', ')]));
  const reply = async body => {
    e.answers = body.cancel ? null : body.answers;  // shown in the question's place once it is settled
    for (const b of el.querySelectorAll('button, input')) b.disabled = true;
    await post(`/api/sessions/${id}/answer`, JSON.stringify({id: e.id, ...body})).catch(err => alert(err.message));
  };
  const sendAll = h('button', {type: 'button', className: 'primary', onclick: () => reply({answers: answers()})}, 'Send answer' + (single ? '' : 's'));
  el.append(...e.questions.map((q, k) => {
    const buttons = q.options.map(o => h('button', {type: 'button', ariaPressed: 'false', onclick: ev => {
      if (single) { a.picked[k] = new Set([o.label]); return reply({answers: answers()}); }
      const set = a.picked[k], on = set.has(o.label);
      if (!q.multi) set.clear();
      on ? set.delete(o.label) : set.add(o.label);
      buttons.forEach((b, n) => { b.ariaPressed = String(set.has(q.options[n].label)); });
    }}, h('b', {}, o.label), o.description ? h('span', {}, o.description) : ''));
    const other = h('input', {type: 'text', placeholder: q.options.length ? 'Something else…' : 'Your answer…', ariaLabel: 'Your own answer',
      oninput: () => { a.other[k] = other.value; },
      onkeydown: ev => { if (ev.key === 'Enter' && other.value.trim()) { ev.preventDefault(); if (single) a.picked[k].clear(); reply({answers: answers()}); } }});
    return h('div', {className: 'q'}, q.header ? h('small', {}, q.header) : '', h('b', {}, q.question),
      q.plan ? markdown(q.plan, h('div', {className: 'plan say'})) : '',
      h('div', {className: 'options'}, ...buttons), h('div', {className: 'other'}, other));
  }), h('div', {className: 'row'}, h('button', {type: 'button', onclick: () => reply({cancel: true})}, 'Dismiss'), single ? '' : sendAll));
  follow = true;
}
function settled(a, answers) {
  a.el.className = 'ask settled';
  a.el.replaceChildren(...a.e.questions.map(q => h('div', {}, q.question + ' ',
    h('span', {className: 'said'}, answers === null ? 'Dismissed' : answers?.[q.question] || ''))));
}

function turn(e) {
  const parts = [];
  if (e.duration) parts.push(e.duration >= 60000 ? `${Math.floor(e.duration / 60000)} min ${Math.round(e.duration % 60000 / 1000)} s` : `${Math.max(1, Math.round(e.duration / 1000))} s`);
  if (typeof e.cost === 'number') parts.push(`$${e.cost.toFixed(2)}`);
  if (e.context?.max) parts.push(`${Math.round(100 * e.context.used / e.context.max)}% context`);
  if (e.error) place(h('div', {className: 'note error'}, e.error));
  if (parts.length) place(h('div', {className: 'turn'}, parts.join(' · ')));
  for (const t of tools.values()) if (!t.done) { t.done = true; toolState(t); }  // nothing still runs once the turn is over
}

function ended(e) {
  over = e.code;
  bootState();
  for (const t of tools.values()) if (!t.done) { t.done = true; t.error = true; toolState(t); }
  const again = h('button', {type: 'button', className: 'primary', onclick: () => busy(again, resume)}, 'Resume');
  place(h('div', {className: 'over'}, h('b', {}, 'Session ended'),
    h('span', {}, e.code ? `Exit status ${e.code}` : ''),
    session?.run_id ? again : ''));
}

async function resume() {
  try {
    const s = await post('/api/sessions', JSON.stringify({project: session.project, kind: 'resume', run_id: session.run_id}));
    window.name = 'session-' + s.id;
    location.hash = s.id;
    location.reload();
  } catch (e) { alert(e.message); }
}

function handle(e) {
  switch (e.type) {
    case 'boot': bootLine(e.text); break;
    case 'hello': info.agent = e.agent; bootState(); break;
    case 'ready': Object.assign(info, e); ready = true; bootState(); pickers(); break;
    case 'user': user(e); break;
    case 'sent': sent(e); break;
    case 'text': block(e, false); break;
    case 'delta': block(e, true); break;
    case 'tool': settleBlocks(); tool(e); break;
    case 'result': result(e); break;
    case 'progress': progress(e); break;
    case 'ask': settleBlocks(); ask(e); break;
    case 'asked': { const a = asks.get(e.id); if (a && !a.el.classList.contains('settled')) settled(a, a.e.answers); break; }
    case 'turn': settleBlocks(); turn(e); break;
    case 'notice': place(h('div', {className: 'note ' + (e.level || 'info')}, e.text)); break;
    case 'status': status = e.state; if (status !== 'working') settleBlocks(); break;
    case 'model': info.model = e.id; pickers(); break;
    case 'effort': info.effort = e.level; pickers(); break;
    case 'todos': plan(e.items); break;
    case 'suggestion': suggest(e.text); break;
    case 'exit': settleBlocks(); ended(e); break;
  }
}
function apply(e) {
  handle(e);
  chrome();
}

// The whole session from nothing: on opening the page, and again whenever the stream reconnects.
function restore(snap) {
  log.replaceChildren();
  blocks = new Map(); tools = new Map(); asks = new Map(); users = new Map(); boot = null; over = null;
  session = snap.session; info = {...snap.info}; ready = snap.ready; status = snap.status;
  bootLine('');
  for (const e of snap.events) handle(e);
  for (const b of blocks.values()) b.streaming = false;
  bootState();
  plan(snap.todos);
  suggest(snap.suggestion);
  pickers();
  chrome();
  follow = true;
  requestAnimationFrame(settle);
}

// ---- the dock: plan, suggestion, composer -------------------------------------------------------

function plan(items) {
  const el = $('plan');
  el.hidden = !items?.length;
  if (el.hidden) return;
  const done = items.filter(t => t.status === 'done').length, now = items.find(t => t.status === 'active') || items.find(t => t.status === 'pending');
  el.replaceChildren(h('summary', {}, h('b', {}, 'Plan'), h('span', {}, done === items.length ? 'All done' : now?.text || ''),
    h('i', {}, `${done} of ${items.length}`)), steps(items));
}
function suggest(text) {
  const el = $('suggest');
  el.hidden = !text || !!input.value;
  el.dataset.text = text || '';
  el.replaceChildren(h('kbd', {}, 'Tab'), h('span', {}, text || ''));
}
$('suggest').onclick = () => { input.value = $('suggest').dataset.text; $('suggest').hidden = true; grow(); input.focus(); };

function pickers() {
  const model = $('model'), effort = $('effort');
  const models = info.models || [];
  model.hidden = !models.length;
  if (models.length) {
    const known = models.some(m => m.id === info.model);
    model.replaceChildren(...(known || !info.model ? [] : [h('option', {value: info.model}, info.model)]),
      ...models.map(m => h('option', {value: m.id, title: m.description || ''}, m.name === m.id || !m.description ? m.name : `${m.name} (${m.description.split(' · ')[0]})`)));
    model.value = info.model || models[0].id;
  }
  const efforts = info.efforts || [];
  effort.hidden = !efforts.length;
  if (efforts.length) {
    effort.replaceChildren(...efforts.map(l => h('option', {value: l}, `${l} effort`)));
    effort.value = info.effort || efforts[0];
  }
}
$('model').onchange = () => post(`/api/sessions/${id}/model`, JSON.stringify({id: $('model').value})).catch(e => alert(e.message));
$('effort').onchange = () => post(`/api/sessions/${id}/effort`, JSON.stringify({level: $('effort').value})).catch(e => alert(e.message));

const touch = matchMedia('(pointer: coarse)').matches;  // a soft keyboard's Enter is a new line; the button sends
const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, innerHeight * .4) + 'px'; };
const draft = {get: () => { try { return sessionStorage.getItem('draft-' + id) || ''; } catch { return ''; } },
               set: v => { try { v ? sessionStorage.setItem('draft-' + id, v) : sessionStorage.removeItem('draft-' + id); } catch {} }};

// Its slash commands and skills, offered while the message is still just a slash and a name.
let picked = 0, offered = [];
function menu() {
  const el = $('menu'), m = /^\/(\S*)$/.exec(input.value);
  const typed = m?.[1].toLowerCase(), starts = c => c.name.toLowerCase().startsWith(typed);
  offered = m ? (info.commands || []).filter(c => c.name.toLowerCase().includes(typed))
    .sort((a, b) => starts(b) - starts(a)).slice(0, 40) : [];  // what begins with it first, else as the agent lists them
  el.hidden = !offered.length;
  if (m && !ready && !offered.length) {
    el.hidden = false;
    return el.replaceChildren(spinner());
  }
  picked = Math.min(picked, Math.max(0, offered.length - 1));
  el.replaceChildren(...offered.map((c, k) => h('button', {type: 'button', role: 'option', ariaSelected: String(k === picked),
    onmousedown: ev => { ev.preventDefault(); choose(c); }}, h('b', {}, '/' + c.name), c.hint ? h('i', {}, c.hint) : '', h('span', {}, c.description || ''))));
  el.querySelector('[aria-selected=true]')?.scrollIntoView({block: 'nearest'});
}
function choose(c) {
  input.value = `/${c.name} `;
  $('menu').hidden = true;
  offered = [];
  grow();
  input.focus();
}

input.addEventListener('input', () => { grow(); picked = 0; menu(); draft.set(input.value); $('suggest').hidden = !$('suggest').dataset.text || !!input.value; });
input.addEventListener('keydown', e => {
  if (offered.length && !$('menu').hidden) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); picked = (picked + (e.key === 'ArrowDown' ? 1 : offered.length - 1)) % offered.length; return menu(); }
    if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey && `/${offered[picked].name}` !== input.value)) { e.preventDefault(); return choose(offered[picked]); }
    if (e.key === 'Escape') { e.preventDefault(); $('menu').hidden = true; offered = []; return; }
  }
  if (e.key === 'Tab' && !input.value && !$('suggest').hidden) { e.preventDefault(); return $('suggest').click(); }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !touch) { e.preventDefault(); $('composer').requestSubmit(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !e.defaultPrevented && status === 'working' && over === null) interrupt();
});
$('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value;
  if (!text.trim() || over !== null) return;
  input.value = '';
  draft.set('');
  $('menu').hidden = true;
  grow();
  try { await post(`/api/sessions/${id}/prompt`, JSON.stringify({text})); }
  catch (err) { input.value = text; grow(); alert(err.message); }
});
const interrupt = () => busy($('halt'), () => post(`/api/sessions/${id}/interrupt`).catch(e => alert(e.message)));
$('halt').onclick = interrupt;

// ---- the header, the tab, and what the dock says ------------------------------------------------

let items = [];  // what the project's plugins tie to this run: its pull request, its ports
const tabs = new BroadcastChannel('sandbox-tabs');
let vsTab = null;  // the VS Code tab this page opened: closed with the session
const leave = () => { vsTab?.close(); window.close(); };
tabs.onmessage = e => { if (e.data.id === id) leave(); };

async function stop() {
  if (!confirm('Stop this session?')) return;
  await post(`/api/sessions/${id}/stop`).catch(e => alert(e.message));
  poll();
}
async function remove() {
  if (session.exit === null && !confirm('Stop and delete this session?')) return;
  // What a plugin offers to tidy up with it (its run's open pull request: close it) is asked
  // about one by one, and done only on a yes.
  const {offers} = await api(`/api/sessions/${id}/offers`).catch(() => ({offers: []}));
  const tidy = offers.filter(o => confirm(o.ask)).map(o => o.url);
  const done = await post(`/api/sessions/${id}/delete`, JSON.stringify({tidy})).catch(e => alert(e.message));
  if (done?.failed?.length) alert('Not done:\n' + done.failed.join('\n'));
  tabs.postMessage(session);
  leave();
  poll();  // still here: this tab was not opened by the dashboard, so it may not close itself
}
async function code(button) {
  const w = vsTab = window.open('', 'code-' + session.workspace);
  await busy(button, async () => {
    try {
      const v = await post('/api/vscode', JSON.stringify({session: id}));
      if (w) w.location.replace('/vscode/?folder=' + encodeURIComponent(v.folder));
    } catch (e) { w?.close(); alert(e.message); }
  });
}

// Drawn only when something it shows changed, so a button under the pointer is not swapped out.
function chrome() {
  if (!session) return;
  const state = over !== null ? null : status;
  const sig = JSON.stringify([session, state, info.model, info.agent, items, ready]);
  if (sig !== lastState) {
    lastState = sig;
    document.title = `${titled(session)} · ${name(session.project)}`;
    $('icon').href = FAVICON[state || 'unlit'];
    const chips = [...items, ...(session.items || []).map(here)].map(i =>
      h('a', {className: 'chip ' + (i.status || ''), href: i.url, target: '_blank', rel: 'noopener', title: tip(i)}, mark(i), i.ref || i.title));
    const vs = h('button', {className: 'icon vscode', onclick: () => code(vs), ariaLabel: 'VS Code', title: 'VS Code'}, ICON.vscode());
    $('bar').replaceChildren(
      h('a', {className: 'home', href: '/', target: 'sandbox-dashboard', title: 'Dashboard', ariaLabel: 'Dashboard'}, ICON.back()),
      h('div', {className: 'who'}, h('b', {title: session.title || ''}, titled(session)),
        h('span', {}, [name(session.project), session.run_id, info.agent && (info.model ? `${info.agent}, ${info.model}` : info.agent)].filter(Boolean).join(' / '))),
      h('div', {className: 'chips'}, ...chips),
      h('span', {className: 'state ' + (state || 'ended')}, h('span', {className: 'lamp ' + (state || '')}), state ? SHORT[state] : 'Ended'),
      session.workspace ? vs : '',
      state ? h('button', {className: 'icon stop', onclick: stop, ariaLabel: 'Stop session', title: 'Stop'}, ICON.stop()) : '',
      h('button', {className: 'icon', onclick: remove, ariaLabel: 'Delete session', title: 'Delete'}, ICON.trash()),
      themeSwitch());
  }
  const working = state === 'working';
  $('halt').hidden = !working;
  input.disabled = over !== null;
  $('send').disabled = over !== null;
  input.placeholder = over !== null ? 'Session ended' : 'Message';
  settle();
}

async function poll() {
  const s = (await api('/api/state').catch(() => ({sessions: [session].filter(Boolean)}))).sessions.find(s => s.id === id);
  if (!s) {
    $('gone').hidden = false;
    for (const el of [scroller, $('dock')]) el.hidden = true;
    es.close();
    leave();
    return $('bar').replaceChildren(h('a', {className: 'home', href: '/', title: 'Dashboard', ariaLabel: 'Dashboard'}, ICON.back()),
      h('div', {className: 'who'}, h('b', {}, 'No session')));
  }
  session = s;
  chrome();
}
async function describe() {
  if (!session?.run_id) return;
  const said = await api('/api/project?project=' + encodeURIComponent(session.project)).catch(() => null);
  if (!said) return;
  items = [...(said.session_items || []), ...(said.run_items || []), ...(said.lists || []).flatMap(l => l.items)]
    .filter(i => i.run_id === session.run_id);
  chrome();
}

// Another session in this tab (a resumed run, a pasted link): start over on it.
addEventListener('hashchange', () => location.reload());
const es = new EventSource(`/api/sessions/${id}/events`);
es.onmessage = m => {
  const e = JSON.parse(m.data);
  if (e.type === 'snapshot') { restore(e); if (!items.length) describe(); }
  else apply(e);
  if (e.type === 'exit' || (e.type === 'snapshot' && e.session.exit !== null)) es.close();  // nothing more will come
};
es.onerror = () => { if (es.readyState === EventSource.CLOSED) poll(); };
input.value = draft.get();
grow();
input.focus();
setInterval(poll, 3000);
setInterval(describe, 60000);
</script>
</body>
</html>
