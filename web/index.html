<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1d36'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%23f2b84b'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%233a3e6e'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%233a3e6e'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%23f2b84b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
<style>
  :root { --dusk: #1b1d36; --night: #0f1123; --rule: #2e3158; --paper: #e6e4f2; --haze: #8c8fb3;
          --lamp: #f2b84b; --link: #9aa5ff; --ok: #6fd3a2; --fail: #ff7b8a; --ask: #c69cff; color-scheme: dark; }
  * { box-sizing: border-box; }
  button { font: inherit; font-size: 14px; color: var(--paper); background: transparent;
           border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  button:hover { border-color: var(--haze); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  body { margin: 0; padding: 36px 32px 64px; background: var(--dusk);
         color: var(--paper); font: 15px/1.45 "Bricolage Grotesque", system-ui, sans-serif; }
  .top { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -.025em; line-height: 1; margin: 0; }
  /* Totals over every project, one per column the projects show, in the same order. */
  .totals { display: flex; flex-wrap: wrap; gap: 12px 44px; margin: -6px 0 26px; }
  .total { display: flex; align-items: baseline; gap: 8px; }
  .total b { font-size: 30px; font-weight: 650; letter-spacing: -.02em; line-height: 1;
             font-variant-numeric: tabular-nums; }
  .total b.lit { color: var(--lamp); }
  .total span { color: var(--haze); }

  /* One panel per project, darker than the page: a lit window per project, rules only inside. */
  section { margin-top: 16px; padding: 22px 26px 26px; background: var(--night); border-radius: 16px; }
  .head { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; }
  h2 { flex: 1 1 auto; font-size: 24px; font-weight: 650; letter-spacing: -.015em;
       line-height: 1.2; margin: 0; overflow-wrap: break-word; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .notes { margin-top: 6px; }
  .columns { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 16px 36px;
             margin-top: 18px; }
  /* A column's heading carries its count, so an empty one reads as quiet, not missing. */
  h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; padding-bottom: 8px;
       border-bottom: 1px solid var(--rule); font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  h3 .count { min-width: 22px; padding: 0 7px; border-radius: 999px; background: #ffffff0d;
              color: var(--haze); font-size: 12px; font-weight: 500; line-height: 20px; text-align: center;
              font-variant-numeric: tabular-nums; }
  h3 .count.lit { background: #f2b84b24; color: var(--lamp); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; min-height: 32px; }
  li > :first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; text-align: left; }
  p { margin: 4px 0; color: var(--haze); font-size: 13px; }

  button.primary { color: var(--night); background: var(--lamp); border-color: var(--lamp); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  /* Round icon buttons on a project's row: + starts a session, >_ opens its terminal. */
  button.glyph { width: 34px; height: 34px; padding: 0; display: inline-grid; place-items: center; }
  button.glyph svg { width: 18px; height: 18px; }
  button.icon { border-color: transparent; color: var(--haze); padding: 3px 8px; }
  button.icon:hover { color: var(--paper); }
  button.icon svg { width: 16px; height: 16px; display: block; }
  button.icon.stop { color: var(--fail); }
  button.icon.stop:hover { color: #ff9aa5; }
  button.icon.play { color: var(--ok); }
  button.icon.play:hover { color: #a3e6c4; }
  button.icon.vscode { color: #3ea6f0; }
  button.icon.vscode:hover { color: #7cc4f7; }
  /* A session is a window in the dark: lit while its agent is at work. */
  button.session { border-radius: 8px; border-color: transparent; padding: 5px 10px 5px 0;
                   font-variant-numeric: tabular-nums; }
  button.session:hover { color: var(--lamp); }
  .lamp { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 10px;
          border: 1.5px solid var(--haze); }
  /* Its colour is what the agent is doing: amber and glowing at work, green when idle, a violet
     blink when it waits on an answer. Ended: an empty ring. */
  .lamp.working { border-color: var(--lamp); background: var(--lamp); animation: glow 2.6s ease-in-out infinite; }
  .lamp.idle { border-color: var(--ok); background: var(--ok); }
  .lamp.question { border-color: var(--ask); background: var(--ask); animation: ask 1.1s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 #f2b84b00; } 50% { box-shadow: 0 0 10px 2px #f2b84b99; } }
  @keyframes ask { 0%, 100% { box-shadow: 0 0 0 0 #c69cff00; opacity: 1; } 50% { box-shadow: 0 0 10px 3px #c69cffaa; opacity: .55; } }
  .ended { color: var(--haze); }
  a { color: var(--paper); text-decoration: none; padding: 4px 0; }
  a:hover { color: var(--link); }
  a .num { color: var(--link); font-variant-numeric: tabular-nums; margin-right: 8px; }
  a .draft { color: var(--haze); }
  /* An item's status (a pull request's CI): a mark ahead of its number, the details on hover. */
  .status { display: inline-block; width: 14px; margin-right: 6px; text-align: center; font-weight: 700; }
  .status.ok { color: var(--ok); }
  .status.fail { color: var(--fail); }
  .status.pending { color: var(--lamp); }
  .status.done { color: var(--ask); }
  /* An item on a session's row (its pull request): a small button, its status mark and ref. */
  a.chip { display: inline-flex; align-items: center; padding: 2px 9px 2px 5px; border-radius: 999px;
           border: 1px solid var(--rule); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  a.chip:hover { border-color: var(--haze); color: var(--paper); }
  a.chip .status { margin-right: 3px; }
  a.chip.ok { border-color: #6fd3a266; }
  a.chip.fail { border-color: #ff7b8a66; }
  a.chip.pending { border-color: #f2b84b66; }
  a.chip.done { border-color: #c69cff66; }

  @media (max-width: 900px) {
    body { padding: 24px 16px 48px; }
    section { padding: 18px 16px 22px; border-radius: 12px; }
    .totals { gap: 8px 22px; }
    .total b { font-size: 24px; }
    .total { gap: 6px; }
    .columns { grid-auto-flow: row; gap: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { .lamp { animation: none !important; } }
</style>
</head>
<body>
<main id="board"></main>
<script>
const $ = id => document.getElementById(id);
// Everything is built with textContent, never innerHTML: PR titles are other people's text.
const h = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};
const api = async (path, opts) => {
  const r = await fetch(path, opts), j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
};
const post = (path, body) => api(path, {method: 'POST', body});
const name = path => path.replace(/\/+$/, '').split('/').pop();
const label = s => s.kind === 'shell' ? 'terminal' : s.run_id + (s.kind === 'resume' ? ' (resumed)' : '');

let state = {projects: [], sessions: []}, plugins = {}, drawn = '';

// What a project's plugins put on a run's session row: items they added there themselves, and
// items they tied to a run (a pull request on the run's branch), from their sections or listed
// for runs only (which show nowhere else).
const runItems = said => [...said.lists.flatMap(list => list.items), ...(said.run_items || [])]
  .filter(i => i.run_id).concat(said.session_items || []);

// The tabs this page opened, by name, so closing a session can close them too. Terminal tabs also
// close themselves when told on `tabs` (they keep doing so after this page reloads); a VS Code tab
// is not ours to script, so only this page's handle on it closes it.
// shortcut: a VS Code tab opened before this page last reloaded stays open; keep the names in
// sessionStorage and look them up with window.open if that matters.
const opened = {}, tabs = new BroadcastChannel('sandbox-tabs');
// A session's tabs: its terminal, VS Code on its checkout, and any item (its pull request) a
// plugin tied to its run.
const tabNames = s => ['session-' + s.id, 'code-' + s.workspace,
  ...Object.values(plugins).flatMap(runItems).filter(i => s.run_id && i.run_id === s.run_id).map(i => 'item-' + i.url)];
const closeTabs = s => tabNames(s).forEach(n => opened[n]?.close());
tabs.onmessage = e => closeTabs(e.data);

// A tab per thing, found again by its name: opened once, brought to the front after that. Always
// called inside the click, before any await, or the popup blocker eats the new tab.
function tab(tabName) {
  const w = window.open('', tabName);
  w?.focus();
  if (w) opened[tabName] = w;
  return w;
}
// Still empty, so ours to fill. Reading another site's tab (GitHub) throws: it is long filled.
const fresh = w => { try { return w.location.href === 'about:blank'; } catch { return false; } };

// One tab per listed item (a pull request, an issue). A plain click only: ctrl/middle-click still
// open a tab of their own, as on any link.
function item(e, i) {
  if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  const w = tab('item-' + i.url);
  // The tab keeps its opener (this page): cut off, Chromium moves it out of reach of both the
  // lookup by name and close(). GitHub could navigate this tab through it; it is your own login.
  if (w && fresh(w)) w.location.replace(i.url);
}

function show(s) {
  const w = tab('session-' + s.id);
  if (w && fresh(w)) w.location.replace('/session#' + s.id);
}

async function start(project, kind, run_id, task) {
  const w = window.open('about:blank');  // its name is the session's id, which the server picks
  try {
    const s = await post('/api/sessions', JSON.stringify({project, kind, run_id, task}));
    if (w) { w.name = 'session-' + s.id; opened[w.name] = w; w.location.replace('/session#' + s.id); }
    refresh();
  } catch (e) { w?.close(); alert(e.message); }
}

// One terminal per project, a shell on this machine in its directory: brought to the front when
// its tab is open, and the server hands back the live one when the tab was closed.
async function terminal(project) {
  const w = tab('terminal-' + project);
  if (!w || !fresh(w)) return;
  try {
    const t = await post('/api/sessions', JSON.stringify({project, kind: 'shell'}));
    w.location.replace('/session#' + t.id);
  } catch (e) { w.close(); alert(e.message); }
}

// Icon buttons' glyphs: drawn, so they keep the button's colour.
const svg = (d, extra = '') => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  e.setAttribute('viewBox', '0 0 20 20');
  e.setAttribute('aria-hidden', 'true');
  e.innerHTML = `<path d="${d}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${extra}`;
  return e;
};
const SAYS = {working: 'working', idle: 'idle, waiting for its next task', question: 'waiting on your answer'};
const PLUS = 'M10 4v12M4 10h12', PROMPT = 'M4 6l4 4-4 4M10 15h6';
// A session's own row, as on a recorder: resume it (play), stop it (the red square); delete it,
// VS Code on its checkout.
const TRASH = 'M3.5 5.5h13M8 5.5V3.5h4v2M5.5 5.5l.8 11h7.4l.8-11M8.5 8.5v5M11.5 8.5v5';
const filled = (inner, viewBox = '0 0 20 20') => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  e.setAttribute('viewBox', viewBox);
  e.setAttribute('aria-hidden', 'true');
  e.innerHTML = inner;
  return e;
};
const PLAY = () => filled('<path d="M6 4.2v11.6a.8.8 0 0 0 1.2.7l9.3-5.8a.8.8 0 0 0 0-1.4L7.2 3.5a.8.8 0 0 0-1.2.7z" fill="currentColor"/>');
const STOP = () => filled('<rect x="4.5" y="4.5" width="11" height="11" rx="2" fill="currentColor"/>');
const VSCODE = () => filled('<path fill="currentColor" fill-rule="evenodd" d="M17 1.5 22 4v16l-5 2.5-9.4-8.6-4.3 3.3L2 16.5v-9l1.3-.7 4.3 3.3zm0 5.7L10.7 12l6.3 4.8z"/>', '0 0 24 24');

async function code(s) {
  const w = tab('code-' + s.workspace);
  if (!w || !fresh(w)) return;
  try {
    const v = await post('/api/vscode', JSON.stringify({session: s.id}));
    w.location.replace('/vscode/?folder=' + encodeURIComponent(v.folder));
  } catch (e) { w.close(); alert(e.message); }
}

// Stopping removes the container and keeps the session listed, its tab showing how it ended, so
// it can be read and resumed. Nothing else stops it: closing its tab, or the browser, does not.
async function stop(s) {
  if (!confirm(`Stop ${label(s)} in ${name(s.project)}? Its container is removed.`)) return;
  await post(`/api/sessions/${s.id}/stop`).catch(e => alert(e.message));
  refresh();
}

// Deleting forgets the session (stopping it first if it still runs) and closes its tabs.
async function remove(s) {
  if (s.exit === null && !confirm(`Stop and delete ${label(s)} in ${name(s.project)}? Its tabs close too.`)) return;
  // What a plugin offers to tidy up with it (its run's open pull request: close it) is asked
  // about one by one, and done only on a yes.
  const {offers} = await api(`/api/sessions/${s.id}/offers`).catch(() => ({offers: []}));
  const tidy = offers.filter(o => confirm(o.ask)).map(o => o.url);
  const done = await post(`/api/sessions/${s.id}/delete`, JSON.stringify({tidy})).catch(e => alert(e.message));
  if (done?.failed?.length) alert('Not done:\n' + done.failed.join('\n'));
  closeTabs(s);
  tabs.postMessage(s);
  refresh();
}

const mark = i => i.status ? h('span', {className: 'status ' + i.status, ariaLabel: i.status_text || i.status},
  {ok: '✓', fail: '✕', pending: '●', done: '⇥'}[i.status] || '') : '';
const tip = i => [(i.ref ? i.ref + ' ' : '') + (i.note ? i.note + ': ' : '') + i.title + (i.branch ? ` (${i.branch})` : ''),
  i.status_text].filter(Boolean).join('\n');
// An item on a session's row: opens in its own tab, as in a section.
const chip = i => h('a', {className: 'chip ' + (i.status || ''), href: i.url, target: '_blank', rel: 'noopener',
                          onclick: e => item(e, i), title: tip(i)}, mark(i), i.ref || i.title);

const column = (title, items, row, none, lit) => h('div', {},
  h('h3', {}, title, h('span', {className: 'count' + (lit ? ' lit' : '')}, String(items.length))),
  items.length ? h('ul', {}, ...items.map(row)) : h('p', {}, none));
const resume = (path, run_id) =>
  h('button', {onclick: () => start(path, 'resume', run_id), title: 'Same branch, same conversation'}, 'Resume');

function render() {
  const sig = JSON.stringify([state, plugins]);
  if (sig === drawn) return;
  drawn = sig;
  const live = id => state.sessions.find(s => s.run_id === id && s.exit === null);
  // The one session of a run that carries its items: the live one, else the latest.
  const holder = (path, id) => {
    const of = agents.filter(s => s.project === path && s.run_id === id);
    return of.find(s => s.exit === null) || of.pop();
  };
  const agents = state.sessions.filter(s => s.kind !== 'shell');  // terminals are not sessions
  const running = agents.some(s => s.exit === null);
  const totals = new Map([['Sessions', agents.length]]);
  for (const said of Object.values(plugins))
    for (const list of said.lists) totals.set(list.title, (totals.get(list.title) || 0) + list.items.length);

  $('board').replaceChildren(
    h('div', {className: 'top'}, h('h1', {}, 'Dashboard')),
    h('div', {className: 'totals'}, ...[...totals].map(([title, n]) => h('div', {className: 'total'},
      h('b', {className: title === 'Sessions' && running ? 'lit' : ''}, String(n)), h('span', {}, title)))),
    ...state.projects.map(path => {
      const mine = agents.filter(s => s.project === path), said = plugins[path];
      const tied = said ? runItems(said) : [];
      const onRow = s => s.run_id && holder(path, s.run_id) === s ? tied.filter(i => i.run_id === s.run_id) : [];
      return h('section', {},
        h('div', {className: 'head'},
          h('h2', {title: path}, name(path)),
          h('div', {className: 'actions'},
            h('button', {className: 'glyph', onclick: () => terminal(path), title: 'Terminal on this machine, in the project',
                         ariaLabel: 'Terminal'}, svg(PROMPT)),
            h('button', {className: 'glyph primary', onclick: () => start(path, 'run'), title: 'New session',
                         ariaLabel: 'New session'}, svg(PLUS)))),
        h('div', {className: 'notes'},
          ...(said ? said.notes.map(note => h('p', {}, note)) : [h('p', {}, 'Reading the project…')])),
        h('div', {className: 'columns'},
        column('Sessions', mine, s => h('li', {},
          h('button', {className: 'session' + (s.exit === null ? '' : ' ended'), onclick: () => show(s), title: 'Open its terminal in a tab'},
            h('span', {className: 'lamp ' + (s.status || ''), title: SAYS[s.status] || 'ended'}),
            label(s) + (s.exit === null ? '' : `, exited ${s.exit}`) + (s.status === 'question' ? ', has a question' : '')),
          ...onRow(s).map(chip),
          s.exit !== null && s.run_id && !live(s.run_id)
            ? h('button', {className: 'icon play', onclick: () => start(path, 'resume', s.run_id), ariaLabel: 'Resume session',
                           title: 'Resume: same branch, same conversation'}, PLAY()) : '',
          s.workspace ? h('button', {className: 'icon vscode', onclick: () => code(s), ariaLabel: 'VS Code',
                                     title: `VS Code on this run's checkout, ${s.workspace}`}, VSCODE()) : '',
          s.exit === null ? h('button', {className: 'icon stop', onclick: () => stop(s), ariaLabel: 'Stop session',
                                         title: 'Stop: remove its container, keep it listed'}, STOP()) : '',
          h('button', {className: 'icon', onclick: () => remove(s), ariaLabel: 'Delete session',
                       title: 'Delete: forget it, stopping it first'}, svg(TRASH))),
          'Nobody at work.', mine.some(s => s.exit === null)),
        // What the project's plugins list (issues, …): the page only draws it. An item a plugin
        // tied to a run is on that run's session row instead, while one is listed; with none, it
        // offers to resume the run. Items listed for runs only (pull requests) have no section.
        ...(said ? said.lists : []).map(list => column(list.title,
          list.items.filter(i => !(i.run_id && holder(path, i.run_id))), i =>
          h('li', {},
            h('a', {href: i.url, target: '_blank', rel: 'noopener', onclick: e => item(e, i), title: tip(i)},
              mark(i), i.ref ? h('span', {className: 'num'}, i.ref) : '',
              i.note ? h('span', {className: 'draft'}, i.note + ': ') : '', i.title),
            i.run_id ? resume(path, i.run_id) : '',
            // A new session on a task the plugin wrote for this item (an issue's Resolve).
            i.start ? h('button', {onclick: () => start(path, 'run', undefined, i.start.task), title: i.start.task},
                        i.start.label) : ''),
          'None open.'))));
    }));
  if (!state.projects.length)
    $('board').append(h('p', {},
      `No projects yet. List their directories, one per line, in ${state.projects_file}`));
}

async function load(path) {
  plugins[path] = await api('/api/project?project=' + encodeURIComponent(path)).catch(e => ({lists: [], notes: [e.message]}));
  render();
}

async function refresh() {
  const before = state.projects.join();
  state = await api('/api/state');
  if (state.projects.join() !== before) state.projects.forEach(load);
  render();
}

refresh();
setInterval(refresh, 3000);
setInterval(() => state.projects.forEach(load), 60000);
</script>
</body>
</html>
