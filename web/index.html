<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandboxes</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
<style>
  :root { --dusk: #1b1d36; --night: #0f1123; --rule: #2e3158; --paper: #e6e4f2; --haze: #8c8fb3;
          --lamp: #f2b84b; --link: #9aa5ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  button { font: inherit; font-size: 14px; color: var(--paper); background: transparent;
           border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  button:hover { border-color: var(--haze); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  body { margin: 0 auto; max-width: 1360px; padding: 36px 32px 64px; background: var(--dusk);
         color: var(--paper); font: 15px/1.45 "Bricolage Grotesque", system-ui, sans-serif; }
  .top { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -.025em; line-height: 1; margin: 0; }
  .tally { color: var(--haze); margin: 0; font-size: 15px; }
  .tally.lit { color: var(--lamp); }

  /* One panel per project, darker than the page: a lit window per project, rules only inside. */
  section { margin-top: 16px; padding: 22px 26px 26px; background: var(--night); border-radius: 16px; }
  .head { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; }
  h2 { flex: 1 1 auto; font-size: 24px; font-weight: 650; letter-spacing: -.015em;
       line-height: 1.2; margin: 0; overflow-wrap: break-word; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .notes { margin-top: 6px; }
  .columns { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 16px 36px;
             margin-top: 18px; }
  /* A column's heading carries its count, so an empty one reads as quiet, not missing. */
  h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; padding-bottom: 8px;
       border-bottom: 1px solid var(--rule); font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  h3 .count { min-width: 22px; padding: 0 7px; border-radius: 999px; background: #ffffff0d;
              color: var(--haze); font-size: 12px; font-weight: 500; line-height: 20px; text-align: center;
              font-variant-numeric: tabular-nums; }
  h3 .count.lit { background: #f2b84b24; color: var(--lamp); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; min-height: 32px; }
  li > :first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; text-align: left; }
  p { margin: 4px 0; color: var(--haze); font-size: 13px; }

  button.primary { color: var(--night); background: var(--lamp); border-color: var(--lamp); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button.icon { border-color: transparent; color: var(--haze); padding: 3px 8px; }
  button.icon:hover { color: var(--paper); }
  /* A session is a window in the dark: lit while its agent is at work. */
  button.session { border-radius: 8px; border-color: transparent; padding: 5px 10px 5px 0;
                   font-variant-numeric: tabular-nums; }
  button.session:hover { color: var(--lamp); }
  .lamp { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 10px;
          border: 1.5px solid var(--haze); }
  .lamp.lit { border-color: var(--lamp); background: var(--lamp); animation: glow 2.6s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 #f2b84b00; } 50% { box-shadow: 0 0 10px 2px #f2b84b99; } }
  .ended { color: var(--haze); }
  a { color: var(--paper); text-decoration: none; padding: 4px 0; }
  a:hover { color: var(--link); }
  a .num { color: var(--link); font-variant-numeric: tabular-nums; margin-right: 8px; }
  a .draft { color: var(--haze); }

  @media (max-width: 900px) {
    body { padding: 24px 16px 48px; }
    section { padding: 18px 16px 22px; border-radius: 12px; }
    .columns { grid-auto-flow: row; gap: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { .lamp.lit { animation: none; } }
</style>
</head>
<body>
<main id="board"></main>
<script>
const $ = id => document.getElementById(id);
// Everything is built with textContent, never innerHTML: PR titles are other people's text.
const h = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};
const api = async (path, opts) => {
  const r = await fetch(path, opts), j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
};
const post = (path, body) => api(path, {method: 'POST', body});
const name = path => path.replace(/\/+$/, '').split('/').pop();
const label = s => s.kind === 'shell' ? 'shell' : s.run_id + (s.kind === 'resume' ? ' (resumed)' : '');

let state = {projects: [], sessions: []}, plugins = {}, drawn = '';

// A tab per thing, found again by its name: opened once, brought to the front after that. Always
// called inside the click, before any await, or the popup blocker eats the new tab.
function tab(tabName) {
  const w = window.open('', tabName);
  w?.focus();
  return w;
}
const fresh = w => w.location.href === 'about:blank';  // still empty, so ours to fill

function show(s) {
  const w = tab('session-' + s.id);
  if (w && fresh(w)) w.location.replace('/session#' + s.id);
}

async function start(project, kind, run_id) {
  const w = window.open('about:blank');  // its name is the session's id, which the server picks
  try {
    const s = await post('/api/sessions', JSON.stringify({project, kind, run_id}));
    if (w) { w.name = 'session-' + s.id; w.location.replace('/session#' + s.id); }
    refresh();
  } catch (e) { w?.close(); alert(e.message); }
}

async function code(s) {
  const w = tab('code-' + s.workspace);
  if (!w || !fresh(w)) return;
  try {
    const v = await post('/api/vscode', JSON.stringify({session: s.id}));
    w.location.replace('/vscode/?folder=' + encodeURIComponent(v.folder));
  } catch (e) { w.close(); alert(e.message); }
}

async function close(s) {
  if (s.exit === null && !confirm(`Stop ${label(s)} in ${name(s.project)}?`)) return;
  await post(`/api/sessions/${s.id}/close`);
  refresh();
}

const column = (title, items, row, none, lit) => h('div', {},
  h('h3', {}, title, h('span', {className: 'count' + (lit ? ' lit' : '')}, String(items.length))),
  items.length ? h('ul', {}, ...items.map(row)) : h('p', {}, none));
const resume = (path, run_id) =>
  h('button', {onclick: () => start(path, 'resume', run_id), title: 'Same branch, same conversation'}, 'Resume');

function render() {
  const sig = JSON.stringify([state, plugins]);
  if (sig === drawn) return;
  drawn = sig;
  const live = id => state.sessions.find(s => s.run_id === id && s.exit === null);
  const running = state.sessions.filter(s => s.exit === null).length;

  $('board').replaceChildren(
    h('div', {className: 'top'},
      h('h1', {}, 'Sandboxes'),
      h('p', {className: 'tally' + (running ? ' lit' : '')},
        running ? `${running} session${running > 1 ? 's' : ''} running` : 'All quiet')),
    ...state.projects.map(path => {
      const mine = state.sessions.filter(s => s.project === path), said = plugins[path];
      return h('section', {},
        h('div', {className: 'head'},
          h('h2', {title: path}, name(path)),
          h('div', {className: 'actions'},
            h('button', {className: 'primary', onclick: () => start(path, 'run')}, 'New session'),
            h('button', {onclick: () => start(path, 'shell'), title: 'A shell on this machine, in the project directory'}, 'Open shell'))),
        h('div', {className: 'notes'},
          ...(said ? said.notes.map(note => h('p', {}, note)) : [h('p', {}, 'Reading the project…')])),
        h('div', {className: 'columns'},
        column('Sessions', mine, s => h('li', {},
          h('button', {className: 'session' + (s.exit === null ? '' : ' ended'), onclick: () => show(s), title: 'Open its terminal in a tab'},
            h('span', {className: 'lamp' + (s.exit === null ? ' lit' : '')}),
            label(s) + (s.exit === null ? '' : `, exited ${s.exit}`)),
          s.workspace ? h('button', {onclick: () => code(s), title: `VS Code on this run's checkout, ${s.workspace}`}, 'Code') : '',
          s.exit !== null && s.run_id && !live(s.run_id) ? resume(path, s.run_id) : '',
          h('button', {className: 'icon', onclick: () => close(s), ariaLabel: s.exit === null ? 'Stop session' : 'Remove session'}, '✕')),
          'Nobody at work.', mine.some(s => s.exit === null)),
        // What the project's plugins list (pull requests, issues, …): the page only draws it. An
        // item a plugin tied to a run opens that run's session, or resumes it.
        ...(said ? said.lists : []).map(list => column(list.title, list.items, i => {
          const s = i.run_id && live(i.run_id);
          return h('li', {},
            h('a', {href: i.url, target: '_blank', rel: 'noopener', title: i.title + (i.branch ? ` (${i.branch})` : '')},
              i.ref ? h('span', {className: 'num'}, i.ref) : '',
              i.note ? h('span', {className: 'draft'}, i.note + ': ') : '', i.title),
            s ? h('button', {onclick: () => show(s)}, 'Open')
              : i.run_id ? resume(path, i.run_id) : '');
        }, 'None open.'))));
    }));
  if (!state.projects.length)
    $('board').append(h('p', {},
      `No projects yet. List their directories, one per line, in ${state.projects_file}`));
}

async function load(path) {
  plugins[path] = await api('/api/project?project=' + encodeURIComponent(path)).catch(e => ({lists: [], notes: [e.message]}));
  render();
}

async function refresh() {
  const before = state.projects.join();
  state = await api('/api/state');
  if (state.projects.join() !== before) state.projects.forEach(load);
  render();
}

refresh();
setInterval(refresh, 3000);
setInterval(() => state.projects.forEach(load), 60000);
</script>
</body>
</html>
