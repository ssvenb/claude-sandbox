<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandboxes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
<style>
  :root { --dusk: #1b1d36; --night: #0f1123; --rule: #2e3158; --paper: #e6e4f2; --haze: #8c8fb3;
          --lamp: #f2b84b; --link: #9aa5ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--dusk); color: var(--paper);
         font: 15px/1.45 "Bricolage Grotesque", system-ui, sans-serif; }
  aside { width: 360px; flex: none; overflow-y: auto; padding: 22px 20px; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px 14px 14px 0; }
  .window { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--night);
            border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
  header { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px;
           border-bottom: 1px solid var(--rule); }
  header strong { font-weight: 650; }
  header .what { flex: 1; color: var(--haze); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stage { flex: 1; min-height: 0; position: relative; }
  #term { position: absolute; inset: 10px 6px 6px 14px; }
  #empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
           background: var(--night); color: var(--haze); padding: 24px; }
  #empty b { display: block; color: var(--paper); font-size: 24px; font-weight: 600; margin-bottom: 6px; }
  #empty[hidden] { display: none; }

  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1; margin: 0; }
  .tally { color: var(--haze); margin: 6px 0 26px; }
  .tally.lit { color: var(--lamp); }
  section { padding: 18px 0; border-top: 1px solid var(--rule); }
  h2 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 10px;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 8px; margin-bottom: 12px; }
  h3 { font-size: 13px; font-weight: 400; color: var(--haze); margin: 16px 0 4px;
       display: flex; align-items: center; gap: 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; }
  li > :first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; text-align: left; }
  p { margin: 4px 0; color: var(--haze); font-size: 13px; }

  button { font: inherit; font-size: 14px; color: var(--paper); background: transparent;
           border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  button:hover { border-color: var(--haze); }
  button.primary { color: var(--night); background: var(--lamp); border-color: var(--lamp); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button.icon { border-color: transparent; color: var(--haze); padding: 3px 8px; }
  button.icon:hover { color: var(--paper); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  /* A session is a window in the dark: lit while its agent is at work. */
  button.session { border-radius: 8px; border-color: transparent; padding: 6px 10px 6px 8px;
                   border-left: 3px solid transparent; font-variant-numeric: tabular-nums; }
  button.session:hover { background: #ffffff0a; }
  button.session[aria-current=true] { background: #f2b84b14; border-left-color: var(--lamp); }
  .lamp { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 10px;
          border: 1.5px solid var(--haze); }
  .lamp.lit { border-color: var(--lamp); background: var(--lamp); animation: glow 2.6s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 #f2b84b00; } 50% { box-shadow: 0 0 10px 2px #f2b84b99; } }
  .ended { color: var(--haze); }
  a { color: var(--paper); text-decoration: none; padding: 4px 0; }
  a:hover { color: var(--link); }
  a .num { color: var(--link); font-variant-numeric: tabular-nums; margin-right: 8px; }
  a .draft { color: var(--haze); }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { width: auto; max-height: 45vh; padding: 16px; }
    main { padding: 0 8px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .lamp.lit { animation: none; } }
</style>
</head>
<body>
<aside id="side" aria-label="Projects"></aside>
<main>
  <div class="window">
    <header id="bar"></header>
    <div id="stage">
      <div id="term"></div>
      <div id="empty"><b>Nobody at work in here yet</b>Start a session on a project, or pick a running one.</div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const $ = id => document.getElementById(id);
// Everything is built with textContent, never innerHTML: PR titles are other people's text.
const h = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};
const api = async (path, opts) => {
  const r = await fetch(path, opts), j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
};
const post = (path, body) => api(path, {method: 'POST', body});
const name = path => path.replace(/\/+$/, '').split('/').pop();
const label = s => s.kind === 'shell' ? 'shell' : s.run_id + (s.kind === 'resume' ? ' (resumed)' : '');

let state = {projects: [], sessions: []}, prs = {}, current = null, es = null, drawn = '';

const term = new Terminal({fontSize: 13, cursorBlink: true, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
  theme: {background: '#0f1123', foreground: '#e6e4f2', cursor: '#f2b84b', selectionBackground: '#9aa5ff55'}});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($('term'));

// One POST at a time, batching what was typed meanwhile: parallel requests could arrive reordered.
let pending = '', busy = false;
async function flush() {
  if (busy || !pending || !current) return;
  busy = true;
  const data = pending;
  pending = '';
  try { await fetch(`/api/sessions/${current}/input`, {method: 'POST', body: data}); } catch {}
  busy = false;
  flush();
}
term.onData(d => { pending += d; flush(); });

function resize() {
  fit.fit();
  if (current) fetch(`/api/sessions/${current}/resize?cols=${term.cols}&rows=${term.rows}`, {method: 'POST'});
}
new ResizeObserver(resize).observe($('term'));

function attach(id) {
  es?.close();
  current = id;
  pending = '';
  location.hash = id || '';
  term.reset();
  if (id) {
    es = new EventSource(`/api/sessions/${id}/stream`);
    // The stream starts with the scrollback again after a reconnect, so start clean each time.
    es.onopen = () => { term.reset(); resize(); };
    es.onmessage = e => term.write(Uint8Array.from(atob(e.data), c => c.charCodeAt(0)));
    es.addEventListener('exit', () => { es.close(); refresh(); });
    term.focus();
  }
  render();
}

async function start(project, kind, run_id) {
  try {
    const s = await post('/api/sessions', JSON.stringify({project, kind, run_id}));
    await refresh();
    attach(s.id);
  } catch (e) { alert(e.message); }
}

async function close(s) {
  if (s.exit === null && !confirm(`Stop ${label(s)} in ${name(s.project)}?`)) return;
  await post(`/api/sessions/${s.id}/close`);
  if (s.exit !== null && current === s.id) attach(null);
  refresh();
}

function render() {
  const sig = JSON.stringify([state, prs, current]);
  if (sig === drawn) return;
  drawn = sig;
  const live = id => state.sessions.find(s => s.run_id === id && s.exit === null);

  const running = state.sessions.filter(s => s.exit === null).length;
  $('side').replaceChildren(
    h('h1', {}, 'Sandboxes'),
    h('p', {className: 'tally' + (running ? ' lit' : '')},
      running ? `${running} session${running > 1 ? 's' : ''} running` : 'All quiet'),
    ...state.projects.map(path => {
    const mine = state.sessions.filter(s => s.project === path), pr = prs[path] || {};
    return h('section', {},
      h('h2', {title: path}, name(path)),
      h('div', {className: 'actions'},
        h('button', {className: 'primary', onclick: () => start(path, 'run')}, 'New session'),
        h('button', {onclick: () => start(path, 'shell'), title: 'A shell on this machine, in the project directory'}, 'Open shell')),
      h('ul', {}, ...mine.map(s => h('li', {},
        h('button', {className: 'session' + (s.exit === null ? '' : ' ended'), ariaCurrent: String(s.id === current), onclick: () => attach(s.id)},
          h('span', {className: 'lamp' + (s.exit === null ? ' lit' : '')}),
          label(s) + (s.exit === null ? '' : `, exited ${s.exit}`)),
        s.exit !== null && s.run_id && !live(s.run_id)
          ? h('button', {onclick: () => start(path, 'resume', s.run_id), title: 'Same branch, same conversation'}, 'Resume') : '',
        h('button', {className: 'icon', onclick: () => close(s), ariaLabel: s.exit === null ? 'Stop session' : 'Remove session'}, '✕')))),
      ...(pr.prs || pr.error ? [
        h('h3', {}, 'Open pull requests',
          h('button', {className: 'icon', onclick: () => loadPrs(path), ariaLabel: 'Reload pull requests'}, '⟳')),
        pr.error ? h('p', {}, pr.error)
          : pr.prs.length ? h('ul', {}, ...pr.prs.map(p => {
              const s = p.run_id && live(p.run_id);
              return h('li', {},
                h('a', {href: p.url, target: '_blank', rel: 'noopener', title: `${p.title} (${p.headRefName})`},
                  h('span', {className: 'num'}, `#${p.number}`),
                  p.isDraft ? h('span', {className: 'draft'}, 'Draft: ') : '', p.title),
                s ? h('button', {onclick: () => attach(s.id)}, 'Open')
                  : p.run_id ? h('button', {onclick: () => start(path, 'resume', p.run_id), title: 'Same branch, same conversation'}, 'Resume') : '');
            }))
          : h('p', {}, 'None open.')] : []));
  }));
  if (!state.projects.length)
    $('side').append(h('p', {},
      `No projects yet. List their directories, one per line, in ${state.projects_file}`));

  const s = state.sessions.find(s => s.id === current);
  $('empty').hidden = !!s;
  $('bar').replaceChildren(...(s
    ? [h('strong', {}, name(s.project)),
       h('span', {className: 'what'}, label(s) + (s.exit === null ? '' : `, exited ${s.exit}`)),
       h('button', {onclick: () => close(s)}, s.exit === null ? 'Stop session' : 'Remove')]
    : [h('span', {className: 'what'}, 'No session open')]));
}

async function loadPrs(path) {
  prs[path] = await api('/api/prs?project=' + encodeURIComponent(path)).catch(e => ({error: e.message}));
  render();
}

async function refresh() {
  const before = state.projects.join();
  state = await api('/api/state');
  if (state.projects.join() !== before) state.projects.forEach(loadPrs);
  render();
}

refresh().then(() => {
  const id = location.hash.slice(1);
  if (state.sessions.some(s => s.id === id)) attach(id); else render();
});
setInterval(refresh, 3000);
setInterval(() => state.projects.forEach(loadPrs), 60000);
</script>
</body>
</html>
