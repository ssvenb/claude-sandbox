<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1d36'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%23f2b84b'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%233a3e6e'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%233a3e6e'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%23f2b84b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<style>
  /* The dashboard: on top, the first message of a new session; under it, on the left what is
     running, grouped by project, and on the right each project with what its plugins list. The
     page itself does not scroll: the bar stays where it is, and each side scrolls on its own. */
  body { height: 100dvh; overflow: hidden; }
  main { max-width: 1384px; height: 100%; margin: 0 auto; padding: 24px 32px 0; display: flex; flex-direction: column; }
  .top { flex: none; }

  /* Starting a session is writing its first message: the sandbox boots behind it. The project and
     the button stand beside the field, on its first line, so they stay put while it grows. */
  .top { display: flex; align-items: flex-start; gap: 12px; }
  .starter { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 8px; }
  .starter .field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 9px 14px; background: var(--panel);
                    border: 1.5px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); }
  .starter .field:focus-within { border-color: var(--lamp); }
  .starter textarea { flex: none; width: 100%; min-width: 0; height: 24px; max-height: 30vh; resize: none; border: 0; outline: 0 !important;
                      background: transparent; padding: 0; font-size: 16px; line-height: 24px; }
  .starter select { background: var(--panel); max-width: 220px; font-weight: 550; height: 45px; border-radius: 14px;
                    padding: 0 10px; cursor: pointer; }
  .starter > button { height: 45px; padding: 0 18px; white-space: nowrap; border-radius: 14px; }
  .top .theme { margin-top: 7px; }

  .board { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px);
           grid-template-rows: minmax(0, 1fr); gap: 12px 24px; margin-top: 20px; }
  /* A side clips what it scrolls: the room around it keeps a focus ring and a window's edge whole. */
  .board > * { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 8px 6px 48px; }
  h2.band { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .none { color: var(--muted); }
  /* The left: under each project's name, a window per running session, lit in the colour of what
     its agent is doing; the ones that ended are folded away under them. */
  .group + .group { margin-top: 22px; }
  .group > h3, .project h3 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.012em; overflow-wrap: anywhere; min-width: 0; }
  .group > h3 { margin-bottom: 8px; }
  .windows { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .window { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; min-height: 112px; padding: 12px 10px 10px 16px;
            background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; text-align: left; min-width: 0; }
  .window::before { content: ""; position: absolute; inset: -1px -1px auto -1px; height: 4px; border-radius: 14px 14px 0 0; background: var(--rule); }
  .window.working::before, .window.starting::before { background: var(--lamp-fill); }
  .window.question::before { background: var(--ask); }
  .window.idle::before { background: var(--ok); }
  .window.question { border-color: var(--ask); }
  /* How it is doing is the colour along its top, and nothing else: its name, and the button that stops it. */
  .window .name { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
  .window .name .stop { margin: -2px 0 0 auto; position: relative; z-index: 1; }  /* above the window's own click */
  .window button.open { all: unset; cursor: pointer; flex: 1; min-width: 0; font-size: 17px; font-weight: 650; letter-spacing: -.012em; line-height: 1.25;
                        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .window button.open::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }  /* the whole window opens it */
  .window button.open:focus-visible::after { outline: 2px solid var(--link); outline-offset: 2px; }
  .window:hover { border-color: var(--muted); }
  .window.question:hover { border-color: var(--ask); }
  .window .doing { color: var(--muted); font-size: 13.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; padding-right: 6px;
                   -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; align-self: start; }
  .window .doing.tool { font-family: var(--mono); font-size: 12px; }
  .window .chips { display: flex; gap: 6px; min-width: 0; overflow: hidden; }
  .window .chips:empty { display: none; }
  .window .chips > * { position: relative; z-index: 1; }
  details.ended { margin-top: 8px; }
  details.ended > summary { display: inline-block; cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; padding: 2px 0; }
  details.ended > summary::-webkit-details-marker { display: none; }
  details.ended > summary:hover { color: var(--ink); }

  /* The right: a panel per project, its buttons, then what its plugins list (issues, …). */
  .project { padding: 14px 16px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; }
  .project + .project { margin-top: 12px; }
  .head { display: flex; align-items: center; gap: 8px; }
  .head h3 { flex: 1; }
  .head h3 small { margin-left: 8px; color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; }
  .notes p { color: var(--muted); font-size: 13px; }
  .project h4 { display: flex; align-items: center; gap: 8px; margin: 12px 0 2px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .project h4 .count { font-weight: 400; font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; min-height: 32px; }
  li > :first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; text-align: left; }
  li button { flex: none; }
  button.session { display: flex; align-items: center; gap: 10px; border-radius: 8px; border-color: transparent; padding: 5px 8px 5px 0; color: var(--muted); }
  button.session:hover .name { color: var(--ink); }
  button.session .name { overflow: hidden; text-overflow: ellipsis; }
  li a { color: var(--ink); text-decoration: none; padding: 4px 0; }
  li a:hover { color: var(--link); }
  a .num { color: var(--link); font-variant-numeric: tabular-nums; margin-right: 8px; }
  a .draft { color: var(--muted); }
  .empty { margin-top: 30px; padding: 28px; border: 1px dashed var(--rule); border-radius: 16px; color: var(--muted); max-width: 70ch; }
  .empty b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 4px; }

  /* A project's sandbox settings (its .claude-sandbox.json), drawn from what the kernel, the
     agents and the plugins declare: one card each, a control per setting. */
  dialog { width: min(820px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
           background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); }
  dialog::backdrop { background: #0b0c1a99; }
  dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
  dialog header, dialog footer { padding: 18px 24px; }
  dialog header { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); }
  dialog header h2 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.015em; }
  dialog header p, dialog .body p { color: var(--muted); font-size: 13px; }
  dialog header .tools { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  dialog header .tools input[type=search] { flex: 1 1 200px; }
  .modes { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
  .modes button { border: 0; padding: 2px 12px; color: var(--muted); }
  .modes button[aria-pressed=true] { background: var(--sunk); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
  dialog footer { display: flex; align-items: center; gap: 10px; justify-content: flex-end;
                  border-top: 1px solid var(--rule); }
  dialog footer .error { flex: 1; color: var(--fail); margin: 0; white-space: pre-wrap; }
  dialog .body { overflow-y: auto; padding: 8px 24px 16px; }
  dialog .body > h4 { margin: 18px 0 2px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .card { margin-top: 10px; padding: 12px 16px 14px; border: 1px solid var(--rule); border-radius: 12px; }
  .card.off { opacity: .72; }
  .card .row { display: flex; align-items: center; gap: 12px; }
  .card .row b { flex: 1; font-weight: 600; }
  .card .row .agent { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .card > p { margin: 2px 0 0; }
  .card .fields { display: grid; gap: 14px; margin-top: 12px; }
  .card .fields:empty { display: none; }
  .field { display: grid; gap: 4px; min-width: 0; }
  .field > .label { display: flex; align-items: center; gap: 8px; height: 24px; font-size: 14px; font-weight: 500; }
  .field > .label label { flex: 1; }
  .field > .label .req { color: var(--lamp); margin-left: 2px; }
  .field > .label code, .card .row code { color: var(--muted); font-size: 11px; font-weight: 400; }
  .field > p { margin: 0; font-size: 12px; }
  .field.bool { grid-template-columns: 1fr auto; align-items: center; column-gap: 12px; }
  .field.bool > .label { grid-column: 1; }
  .field.bool > p { grid-column: 1; }
  .field.bool > .control { grid-column: 2; grid-row: 1 / span 2; justify-self: end; }
  .control { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .control > input, .control > select, .control > textarea, .control > .entries,
  .control > fieldset, .control > .chips { flex: 1; min-width: 0; }
  .reset { border-color: transparent; color: var(--muted); padding: 0 8px; font-size: 12px; line-height: 20px; }
  .reset:hover { color: var(--ink); }
  .default { color: var(--muted); font-size: 12px; }
  dialog input, dialog select, dialog textarea { font-size: 13px; }
  dialog textarea { display: block; width: 100%; min-height: 64px; resize: vertical; }
  .mono, textarea.json { font-family: var(--mono); }
  .bad { border-color: var(--fail) !important; }
  /* A switch: on is lit; while it only shows the default, it is drawn hollow. */
  button.switch { position: relative; width: 42px; height: 24px; padding: 0; flex: none;
                  background: var(--sunk); border-color: var(--rule); }
  button.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
                         border-radius: 50%; background: var(--muted); transition: transform .15s; }
  button.switch[aria-checked=true] { background: var(--ok); border-color: var(--ok); }
  button.switch[aria-checked=true]::after { transform: translateX(18px); background: var(--panel); }
  button.switch.unset { background: transparent; }
  button.switch.unset[aria-checked=true] { background: var(--ok-wash); border-color: var(--ok); }
  button.switch.unset[aria-checked=true]::after { background: var(--ok); }
  /* Lists and maps: a row per entry, its own remove button; objects in a list are cards of their own. */
  .entries { display: grid; gap: 6px; }
  .entry { display: flex; gap: 6px; align-items: center; }
  .entry > input { flex: 1; min-width: 0; }
  .entry > input.key { flex: 0 1 40%; }
  .add { justify-self: start; font-size: 13px; color: var(--link); border-style: dashed; }
  .remove { border-color: transparent; color: var(--muted); padding: 2px 8px; }
  .remove:hover { color: var(--fail); }
  .item { padding: 10px 12px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sunk); }
  .item > .row { display: flex; align-items: center; gap: 8px; }
  .item > .row b { flex: 1; font-weight: 600; font-size: 14px; }
  .item .fields { margin-top: 8px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .item .fields > .wide { grid-column: 1 / -1; }
  .item input, .item select, .item textarea { background: var(--panel); }
  fieldset.object { margin: 0; padding: 8px 12px 12px; border: 1px solid var(--rule); border-radius: 10px; }
  fieldset.object > .fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; font-size: 13px;
                 border: 1px solid var(--rule); border-radius: 999px; cursor: pointer; }
  .chips label:has(input:checked) { border-color: var(--link); color: var(--link); }
  .chips input { margin: 0; accent-color: var(--link); }
  .kept { font-size: 12px; }

  @media (max-width: 900px) {
    .top { flex-wrap: wrap; }
    .starter { flex-wrap: wrap; flex-basis: 100%; }
    .starter .field { flex-basis: 100%; }
    .starter select { flex: 1; max-width: none; }
    .top .theme { margin: 0 0 0 auto; }
    /* One column: the page scrolls again, under the bar that stays at its top. */
    body { height: auto; overflow: visible; padding: 0 14px 48px; }
    main { display: block; height: auto; padding: 0; }
    .top { position: sticky; top: 0; z-index: 3; margin: 0 -14px; padding: 14px 14px 10px; background: var(--page); }
    .board { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; gap: 28px; margin-top: 10px; }
    .board > * { overflow: visible; padding: 0; }
    .window { min-height: 0; }
    dialog { width: 100vw; max-width: 100vw; max-height: 100dvh; height: 100dvh; margin: 0; border-radius: 0; border: 0; }
    dialog form { max-height: 100dvh; height: 100%; }
    dialog .body { flex: 1; }
    dialog header, dialog footer { padding: 14px 16px; }
    dialog .body { padding: 4px 16px 12px; }
    .card { padding: 10px 12px 12px; }
  }
</style>
</head>
<body>
<main id="board"><p class="loading"><span class="spin"></span>Reading your projects</p></main>
<dialog id="config"></dialog>
<script>
window.name = 'sandbox-dashboard';  // where a chat's way back lands
let state = {projects: [], sessions: []}, plugins = {}, drawn = '';

// What a project's plugins put on a run's session row: items they added there themselves, and
// items they tied to a run (a pull request on the run's branch), from their sections or listed
// for runs only (which show nowhere else).
const liveItems = s => (s.items || []).map(here);
const runItems = said => [...said.lists.flatMap(list => list.items), ...(said.run_items || [])]
  .filter(i => i.run_id).concat(said.session_items || []);

// The tabs this page opened, by name, so closing a session can close them too. A session's own
// page also closes itself (and the VS Code tab it opened) when told on `tabs`.
const opened = {}, tabs = new BroadcastChannel('sandbox-tabs');
// A session's tabs: its page, any item (its pull request) a plugin tied to its run, and those
// opened from it (a port it published while it ran, no longer listed once it is stopped).
const owned = {};
const tabNames = s => ['session-' + s.id, ...(owned[s.id] || []),
  ...Object.values(plugins).flatMap(runItems).filter(i => s.run_id && i.run_id === s.run_id)
    .concat(liveItems(s)).map(i => 'item-' + i.url)];
const closeTabs = s => tabNames(s).forEach(n => opened[n]?.close());
tabs.onmessage = e => closeTabs(e.data);

// A tab per thing, found again by its name: opened once, brought to the front after that. Always
// called inside the click, before any await, or the popup blocker eats the new tab.
function tab(tabName) {
  const w = window.open('', tabName);
  w?.focus();
  if (w) opened[tabName] = w;
  return w;
}
// Still empty, so ours to fill. Reading another site's tab (GitHub) throws: it is long filled.
const fresh = w => { try { return w.location.href === 'about:blank'; } catch { return false; } };

// One tab per listed item (a pull request, an issue). A plain click only: ctrl/middle-click still
// open a tab of their own, as on any link.
function item(e, i, s) {
  if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  const w = tab('item-' + i.url);
  if (s) (owned[s.id] ??= new Set()).add('item-' + i.url);
  // The tab keeps its opener (this page): cut off, Chromium moves it out of reach of both the
  // lookup by name and close(). GitHub could navigate this tab through it; it is your own login.
  if (w && fresh(w)) w.location.replace(i.url);
}

// A session's page: its chat, or the terminal of one that runs in a pty.
const page = s => (s.ui === 'chat' ? '/chat#' : '/session#') + s.id;
function show(s) {
  const w = tab('session-' + s.id);
  if (w && fresh(w)) w.location.replace(page(s));
}

async function start(project, kind, run_id, task, images) {
  const w = window.open('about:blank');  // its name is the session's id, which the server picks
  try {
    const s = await post('/api/sessions', JSON.stringify({project, kind, run_id, task, images}));
    if (w) { w.name = 'session-' + s.id; opened[w.name] = w; w.location.replace(page(s)); }
    refresh();
  } catch (e) { w?.close(); alert(e.message); }
}

// One terminal per project, a shell on this machine in its directory: brought to the front when
// its tab is open, and the server hands back the live one when the tab was closed.
async function terminal(project) {
  const w = tab('terminal-' + project);
  if (!w || !fresh(w)) return;
  try {
    const t = await post('/api/sessions', JSON.stringify({project, kind: 'shell'}));
    w.location.replace('/session#' + t.id);
  } catch (e) { w.close(); alert(e.message); }
}

// Stopping removes the container and keeps the session listed, its tab showing how it ended, so
// it can be read and resumed. Nothing else stops it: closing its tab, or the browser, does not.
async function stop(s) {
  if (!confirm(`Stop “${titled(s)}”?`)) return;
  await post(`/api/sessions/${s.id}/stop`).catch(e => alert(e.message));
  refresh();
}

// Deleting forgets the session (stopping it first if it still runs) and closes its tabs.
async function remove(s) {
  if (s.exit === null && !confirm(`Stop and delete “${titled(s)}”?`)) return;
  // What a plugin offers to tidy up with it (its run's open pull request: close it) is asked
  // about one by one, and done only on a yes.
  const {offers} = await api(`/api/sessions/${s.id}/offers`).catch(() => ({offers: []}));
  const tidy = offers.filter(o => confirm(o.ask)).map(o => o.url);
  const done = await post(`/api/sessions/${s.id}/delete`, JSON.stringify({tidy})).catch(e => alert(e.message));
  if (done?.failed?.length) alert('Not done:\n' + done.failed.join('\n'));
  closeTabs(s);
  tabs.postMessage(s);
  refresh();
}

// A project's sandbox settings, its .claude-sandbox.json, as a form: each setting the kernel, an
// agent or a plugin declares (its manifest's "settings": type, label, default) gets a control of
// its type, each plugin a switch. A setting left unset falls through to the repo's .env, your
// shell, then its default; ↺ unsets one again. Whatever the form has no control for stays as it
// is, and the JSON view edits the whole file. run.sh reads it on the project's next session.
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const ON = [true, 1, '1', 'true'];
const pretty = v => JSON.stringify(v, null, 2);

// A slot is where one value lives: get() is undefined while unset, set(undefined) unsets it.
const slot = (obj, key, after) => ({
  get: () => obj()?.[key],
  set: v => { const o = obj(true); if (v === undefined) delete o[key]; else o[key] = v; after?.(); },
});
// Values in .env are exported as strings, so a switch writes 1/0 there and reads either spelling.
const envSlot = (s, spec) => spec.type !== 'boolean' ? s
  : {get: () => s.get() === undefined ? undefined : ON.includes(s.get()), set: v => s.set(v === undefined ? v : v ? 1 : 0)};
const shownIn = (field, value, fields) => Object.entries(field.when || {}).every(([k, allowed]) =>
  allowed.includes(value?.[k] ?? fields.find(f => f.key === k)?.default));

// Entries added and left empty are not saved; a list that held only those goes with them.
function tidy(v) {
  if (Array.isArray(v)) return v.filter(x => x !== '').map(tidy);
  if (v && typeof v === 'object')
    for (const [k, x] of Object.entries(v)) {
      v[k] = tidy(x);
      if (Array.isArray(x) && x.length && !v[k].length) delete v[k];
    }
  return v;
}

let uid = 0;
function settingsForm(ctx) {
  // ctx.bad: controls holding what is not yet a value (JSON that does not parse), blocking Save.
  const markBad = (el, bad) => { el.classList.toggle('bad', bad); bad ? ctx.bad.add(el) : ctx.bad.delete(el); };

  // One setting: its label, its control, its description; ↺ while it is set.
  function field(spec, s, name, opts = {}) {
    const id = 'f' + ++uid, kind = spec.type || 'string';
    const control = h('div', {className: 'control'});
    const reset = h('button', {type: 'button', className: 'reset', title: 'Unset: use the default', ariaLabel: 'Reset ' + (spec.label || name),
                               onclick: () => { s.set(undefined); draw(); opts.changed?.(); }}, '↺ reset');
    const showReset = () => reset.classList.toggle('hidden', s.get() === undefined || !!opts.noReset);
    const set = v => { s.set(v); showReset(); opts.changed?.(); };
    const el = h('div', {className: 'field' + (kind === 'boolean' ? ' bool' : '') +
                        (['list', 'map', 'object', 'json', 'text'].includes(kind) ? ' wide' : '')},
      h('div', {className: 'label'},
        h('label', {htmlFor: id}, spec.label || spec.key || spec.env, spec.required || opts.required ? h('span', {className: 'req', title: 'Required'}, '*') : ''),
        spec.env ? h('code', {title: 'Set in the env block'}, spec.env) : '', reset),
      control,
      spec.description ? h('p', {}, spec.description) : '');
    const ph = spec.default !== undefined && !['boolean', 'enum'].includes(kind) ? String(spec.default) : spec.placeholder || '';
    function draw() {
      showReset();
      const v = s.get();
      if (kind === 'boolean') {
        const on = v === undefined ? !!spec.default : !!v;
        const sw = h('button', {type: 'button', id, name, role: 'switch', ariaLabel: opts.ariaLabel || spec.label, className: 'switch' + (v === undefined ? ' unset' : ''),
                                ariaChecked: String(on), title: v === undefined ? `Default: ${on ? 'on' : 'off'}` : on ? 'On' : 'Off',
                                onclick: () => { set(!on); draw(); }});
        control.replaceChildren(v === undefined ? h('span', {className: 'default'}, 'default') : '', sw);
      } else if (kind === 'enum') {
        const sel = h('select', {id, name, onchange: () => set(sel.value === '' ? undefined : sel.value)},
          h('option', {value: ''}, spec.default !== undefined ? `Default (${spec.default})` : '—'),
          ...spec.choices.map(c => h('option', {value: c}, String(c))));
        sel.value = v === undefined ? '' : String(v);
        control.replaceChildren(sel);
      } else if (kind === 'integer') {
        const inp = h('input', {id, name, type: 'number', step: 1, placeholder: ph, value: v ?? '',
                                oninput: () => { const ok = inp.value === '' || inp.validity.valid; markBad(inp, !ok);
                                                 if (ok) set(inp.value === '' ? undefined : Number(inp.value)); }});
        if (spec.min !== undefined) inp.min = spec.min;
        if (spec.max !== undefined) inp.max = spec.max;
        control.replaceChildren(inp);
      } else if (kind === 'text') {
        const area = h('textarea', {id, name, placeholder: ph, value: Array.isArray(v) ? v.join('\n') : v ?? '',
                                    oninput: () => set(area.value === '' ? undefined : area.value)});
        control.replaceChildren(area);
      } else if (kind === 'json') {
        const area = h('textarea', {id, name, className: 'json', placeholder: ph || '{ }', value: v === undefined ? '' : pretty(v),
          oninput: () => {
            if (!area.value.trim()) { markBad(area, false); return set(undefined); }
            try { const parsed = JSON.parse(area.value); markBad(area, false); set(parsed); }
            catch { markBad(area, true); }
          }});
        control.replaceChildren(area);
      } else if (kind === 'list') {
        control.replaceChildren(list(spec, s, name, set, draw, id, control));
      } else if (kind === 'map') {
        control.replaceChildren(map(spec, s, name, set, id));
      } else if (kind === 'object') {
        control.replaceChildren(object(spec, s, name, set, id));
      } else {  // string, path
        const inp = h('input', {id, name, type: spec.secret ? 'password' : 'text', placeholder: ph, value: v ?? '',
                                autocomplete: 'off', spellcheck: false,
                                className: spec.monospace || kind === 'path' ? 'mono' : '',
                                oninput: () => {
                                  markBad(inp, !!spec.pattern && !new RegExp(`^(?:${spec.pattern})$`).test(inp.value));
                                  set(inp.value === '' ? undefined : inp.value);
                                }});
        control.replaceChildren(inp);
      }
    }
    draw();
    el.dataset.search = [spec.label, spec.key, spec.env, spec.description].join(' ').toLowerCase();
    return el;
  }

  // A list of enums is a set of chips to tick; any other list a row per entry, objects as cards.
  function list(spec, s, name, set, redraw, id, control) {
    const items = spec.items || {type: 'string'};
    const arr = () => s.get() || [];
    const put = a => set(a.length ? a : undefined);
    if (items.type === 'enum') {
      return h('div', {className: 'chips', id, role: 'group'}, ...items.choices.map(c => h('label', {},
        h('input', {type: 'checkbox', name: `${name}.${c}`, checked: arr().includes(c),
                    onchange: e => put(e.target.checked ? [...arr(), c] : arr().filter(x => x !== c))}), String(c))));
    }
    const at = i => ({get: () => arr()[i], set: v => { const a = [...arr()]; a[i] = v; put(a); }});
    const drop = i => () => { const a = [...arr()]; a.splice(i, 1); put(a); redraw(); };
    const rows = arr().map((v, i) => {
      if (items.type === 'object') {
        const title = h('b', {}, (items.title && v?.[items.title]) || `#${i + 1}`);
        const sub = {...items, label: undefined};
        return h('div', {className: 'item'},
          h('div', {className: 'row'}, title,
            h('button', {type: 'button', className: 'remove', title: 'Remove', ariaLabel: `Remove ${title.textContent}`, onclick: drop(i)}, '✕')),
          object(sub, at(i), `${name}.${i}`, v2 => { at(i).set(v2 ?? {}); title.textContent = (items.title && v2?.[items.title]) || `#${i + 1}`; },
                 i === 0 ? id : undefined, true));
      }
      const inp = h('input', {name: `${name}.${i}`, value: v ?? '', placeholder: items.placeholder || '', autocomplete: 'off',
                              spellcheck: false, className: items.monospace ? 'mono' : '', id: i === 0 ? id : '',
                              oninput: () => at(i).set(items.type === 'integer' ? Number(inp.value) : inp.value)});
      return h('div', {className: 'entry'}, inp,
        h('button', {type: 'button', className: 'remove', title: 'Remove', ariaLabel: 'Remove ' + (v || 'entry'), onclick: drop(i)}, '✕'));
    });
    // A new entry starts empty (left out when saved while still empty), its first input focused.
    const add = h('button', {type: 'button', className: 'add', onclick: () => {
      s.set([...arr(), items.type === 'object' ? {} : '']);
      redraw();
      control.querySelector('.entries').lastElementChild.previousElementSibling?.querySelector('input, select')?.focus();
    }}, '+ Add');
    return h('div', {className: 'entries'}, ...rows, add);
  }

  // Name → value pairs (environment variables): a row each.
  function map(spec, s, name, set, id) {
    const pairs = Object.entries(s.get() || {});
    const write = () => {
      const o = {};
      for (const [k, v] of pairs) if (k !== '') o[k] = v;
      set(Object.keys(o).length ? o : undefined);
    };
    // A pair with no name yet is not written, but keeps its row until it gets one.
    const row = (pair, i) => {
      const key = h('input', {className: 'key mono', name: `${name}.${i}.key`, value: pair[0], placeholder: spec.placeholder || 'NAME',
                              ariaLabel: 'Name', spellcheck: false, id: i === 0 ? id : '', oninput: () => { pair[0] = key.value; write(); }});
      const val = h('input', {className: 'mono', name: `${name}.${i}.value`, value: String(pair[1]), placeholder: 'value', ariaLabel: 'Value',
                              spellcheck: false, oninput: () => { pair[1] = val.value; write(); }});
      const el = h('div', {className: 'entry'}, key, val,
        h('button', {type: 'button', className: 'remove', title: 'Remove', ariaLabel: 'Remove ' + (pair[0] || 'entry'),
                     onclick: () => { pairs.splice(pairs.indexOf(pair), 1); write(); el.remove(); }}, '✕'));
      return el;
    };
    const rows = pairs.map(row);
    const add = h('button', {type: 'button', className: 'add', onclick: () => {
      const pair = ['', ''];
      pairs.push(pair);
      const el = row(pair, pairs.length - 1);
      add.before(el);
      el.querySelector('input').focus();
    }}, '+ Add');
    return h('div', {className: 'entries'}, ...rows, add);
  }

  // An object: its fields, those whose `when` does not match its other values left out.
  function object(spec, s, name, set, id, bare) {
    const fields = spec.fields || [];
    const box = h('div', {className: 'fields'});
    function draw() {
      const v = s.get();
      box.replaceChildren(...fields.filter(f => shownIn(f, v, fields)).map(f => {
        const fs = {get: () => s.get()?.[f.key],
                    set: x => { const o = {...(s.get() || {})}; if (x === undefined) delete o[f.key]; else o[f.key] = x;
                                set(Object.keys(o).length || bare ? o : undefined); }};
        const gates = fields.some(g => g.when && f.key in g.when);
        return field(f, fs, `${name}.${f.key}`, {changed: gates ? draw : undefined});
      }));
    }
    draw();
    if (bare) return box;
    return h('fieldset', {className: 'object', id}, box);
  }

  return {field};
}

async function configure(path) {
  const dlg = $('config');
  let got;
  try { got = await api('/api/config?project=' + encodeURIComponent(path)); }
  catch (e) { return alert(e.message); }
  let draft = clone(got.config), mode = 'form';
  const ctx = {bad: new Set()};
  const error = h('p', {className: 'error', role: 'alert'});
  const body = h('div', {className: 'body'});
  const filter = h('input', {type: 'search', placeholder: 'Filter settings and plugins…', ariaLabel: 'Filter',
                             oninput: () => applyFilter()});
  const area = h('textarea', {className: 'json', name: 'json', ariaLabel: 'The whole file, as JSON', spellcheck: false,
                              style: 'min-height: 50vh'});
  const env = create => (create && !draft.env && (draft.env = {}), draft.env);
  const section = name => create => {
    if (create) { draft.plugins ??= {}; draft.plugins[name] ??= {}; }
    return draft.plugins?.[name];
  };
  const {field} = settingsForm(ctx);
  const envField = spec => field(spec, envSlot(slot(env, spec.env), spec), 'env.' + spec.env);

  function applyFilter() {
    const q = filter.value.trim().toLowerCase();
    for (const card of body.querySelectorAll('.card')) {
      const hit = !q || card.dataset.search.includes(q);
      const fields = [...card.querySelectorAll(':scope > .fields > .field')];
      const fieldHits = fields.filter(f => f.dataset.search.includes(q));
      card.classList.toggle('hidden', !hit && !fieldHits.length);
      for (const f of fields) f.classList.toggle('hidden', !!q && !hit && !fieldHits.includes(f));
    }
    for (const h4 of body.querySelectorAll('h4')) {
      let n = h4.nextElementSibling, any = false;
      while (n && n.tagName !== 'H4') { any ||= !n.classList.contains('hidden'); n = n.nextElementSibling; }
      h4.classList.toggle('hidden', !any);
    }
  }

  const card = (title, description, fields, extra = {}) => {
    const el = h('div', {className: 'card' + (extra.off ? ' off' : '')},
      h('div', {className: 'row'}, h('b', {}, title, extra.tag ? h('span', {className: 'agent'}, extra.tag) : ''), extra.right || ''),
      description ? h('p', {}, description) : '',
      h('div', {className: 'fields'}, ...fields), extra.after || '');
    el.dataset.search = [title, description, extra.tag].join(' ').toLowerCase();
    return el;
  };

  function drawForm() {
    const declaredEnv = new Set([...got.kernel.settings, ...got.agents.flatMap(a => a.settings),
                                 ...got.plugins.flatMap(p => p.settings)].filter(s => s.env).map(s => s.env));
    // env keys nobody declares: a plain name → value list, so nothing in the file goes missing.
    const others = {get: () => { const o = Object.fromEntries(Object.entries(draft.env || {}).filter(([k]) => !declaredEnv.has(k)));
                                 return Object.keys(o).length ? o : undefined; },
                    set: v => { for (const k of Object.keys(draft.env || {})) if (!declaredEnv.has(k)) delete draft.env[k];
                                if (v) Object.assign(env(true), v); }};
    const agentNow = () => draft.env?.AGENT ?? got.kernel.settings.find(s => s.env === 'AGENT')?.default;
    const plugins = got.plugins.map(p => {
      const sec = section(p.name);
      const enabled = {get: () => { const e = sec()?.enabled; return e === undefined ? undefined : ON.includes(e); },
                       set: v => { if (v === undefined) { if (sec()) delete sec().enabled; } else sec(true).enabled = v; }};
      const fieldsBox = () => p.settings.map(spec => spec.env
        ? field({...spec, required: spec.required || (p.requiredEnv || []).includes(spec.env)}, envSlot(slot(env, spec.env), spec), 'env.' + spec.env)
        : field(spec, slot(sec, spec.key), `plugins.${p.name}.${spec.key}`));
      const declaredKeys = new Set(['enabled', ...p.settings.filter(s => s.key).map(s => s.key)]);
      const kept = Object.keys(sec() || {}).filter(k => !declaredKeys.has(k));
      let el;
      const on = () => enabled.get() ?? p.defaultEnabled;
      const sw = field({type: 'boolean', label: 'Enabled', default: p.defaultEnabled}, enabled, 'enabled-' + p.name,
                       {ariaLabel: p.name + ' enabled', changed: () => { el.classList.toggle('off', !on()); el.querySelector(':scope > .fields').classList.toggle('hidden', !on()); }});
      // Only its control and ↺ go on the card's head, next to the name.
      const right = h('div', {className: 'control'}, sw.querySelector('.reset'), sw.querySelector('.control'));
      el = card(p.name, p.description, fieldsBox(), {
        tag: p.requiredAgent ? p.requiredAgent + ' only' : '', off: !on(), right,
        after: kept.length ? h('p', {className: 'kept'}, `Also holds ${kept.join(', ')}: kept as is (edit it in the JSON view).`) : ''});
      el.querySelector(':scope > .fields').classList.toggle('hidden', !on());
      el.dataset.search += ' ' + p.settings.map(s => [s.label, s.key, s.env].join(' ')).join(' ').toLowerCase();
      return el;
    });
    body.replaceChildren(
      h('p', {}, 'Unset settings come from the repo\'s .env or your shell, else their default. ↺ reset unsets one again.'),
      h('h4', {}, 'Sandbox'),
      card('General', got.kernel.description, got.kernel.settings.map(envField)),
      ...got.agents.map(a => card(a.name + ' agent', a.description, a.settings.map(envField),
                                  {tag: a.name === agentNow() ? 'selected' : ''})),
      card('Other variables', 'Further sandbox settings for the env block, by name (see .env.example).',
           [field({type: 'map', label: 'Variables', placeholder: 'NAME'}, others, 'env-other')]),
      h('h4', {}, 'Plugins'),
      ...plugins);
    applyFilter();
  }

  // What the file becomes: empty blocks and sections left out.
  function result() {
    if (mode === 'json') {
      let v;
      try { v = JSON.parse(area.value); } catch (e) { throw new Error('Not valid JSON: ' + e.message); }
      if (!v || typeof v !== 'object' || Array.isArray(v)) throw new Error('The file must hold a JSON object');
      return v;
    }
    if (ctx.bad.size) throw new Error('Fix the fields marked red first');
    const next = tidy(clone(draft));
    for (const [name, sec] of Object.entries(next.plugins || {}))
      if (sec && typeof sec === 'object' && !Object.keys(sec).length) delete next.plugins[name];
    for (const key of ['env', 'plugins'])
      if (next[key] && !Object.keys(next[key]).length) delete next[key];
    return next;
  }

  const formBtn = h('button', {type: 'button', ariaPressed: 'true', onclick: () => switchTo('form')}, 'Form');
  const jsonBtn = h('button', {type: 'button', ariaPressed: 'false', onclick: () => switchTo('json')}, 'JSON');
  function switchTo(next) {
    if (next === mode) return;
    error.textContent = '';
    try {
      if (next === 'json') { area.value = pretty(result()); body.replaceChildren(area); }
      else { draft = result(); ctx.bad.clear(); mode = next; drawForm(); }
    } catch (e) { error.textContent = e.message; return; }
    mode = next;
    formBtn.ariaPressed = String(mode === 'form');
    jsonBtn.ariaPressed = String(mode === 'json');
    filter.disabled = mode === 'json';
  }

  async function save(e) {
    e.preventDefault();
    error.textContent = '';
    try {
      await post('/api/config', JSON.stringify({project: path, config: result()}));
      dlg.close();
      load(path);  // what the plugins show now, or run.sh's complaint about the file
    } catch (err) { error.textContent = err.message; }
  }

  drawForm();
  dlg.replaceChildren(h('form', {onsubmit: save},
    h('header', {}, h('h2', {}, name(path) + ' settings'),
      h('p', {}, got.file + (got.exists ? '' : ' (not there yet: saving creates it)')),
      h('div', {className: 'tools'}, filter, h('div', {className: 'modes', role: 'group', ariaLabel: 'View'}, formBtn, jsonBtn))),
    body,
    h('footer', {}, error,
      h('button', {type: 'button', onclick: () => dlg.close()}, 'Cancel'),
      h('button', {type: 'submit', className: 'primary'}, 'Save'))));
  dlg.showModal();
  filter.focus();
}

// An item on a session's row: opens in its own tab, as in a section.
const chip = s => i => h('a', {className: 'chip ' + (i.status || ''), href: i.url, target: '_blank', rel: 'noopener',
                               onclick: e => item(e, i, s), title: tip(i)}, mark(i), i.ref || i.title);

// The first message of a new session (pictures pasted into it go along), and the project it is for. One form for the page's whole
// life (rebuilt only when the projects change), so what is being written survives a redraw.
let starterForm = null, starterFor = '';
function starter() {
  const projects = state.projects;
  if (starterForm && starterFor === projects.join()) return starterForm;
  starterFor = projects.join();
  const text = h('textarea', {rows: 1, name: 'task', placeholder: 'What should an agent work on?', ariaLabel: 'First message of a new session',
    value: starterForm?.elements.task.value || '', oninput: () => grow(),
    onkeydown: e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); starterForm.requestSubmit(); } }});
  const grow = () => { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, innerHeight * .3) + 'px'; };
  const pick = h('select', {name: 'project', ariaLabel: 'Project'}, ...projects.map(p => h('option', {value: p}, name(p))));
  const go = h('button', {type: 'submit', className: 'primary'}, 'Start session');
  const tray = h('div', {className: 'shots'}), held = pasted(text, tray);
  starterForm = h('form', {className: 'starter', onsubmit: e => {
    e.preventDefault();
    const task = text.value.trim(), images = held.take();
    text.value = '';
    grow();
    busy(go, () => start(projects.length > 1 ? pick.value : projects[0], 'run', undefined, task || undefined, images.length ? images : undefined));
  }}, h('div', {className: 'field'}, tray, text), projects.length > 1 ? pick : '', go);
  return starterForm;
}

// A running session as a window: what it was asked and what it is at right now. How it is doing
// is its colour (its class), spelled out only for a screen reader.
function windowOf(s, items) {
  const doing = s.status === 'starting' ? h('div', {className: 'doing'}, s.waiting ? `${s.waiting} message${s.waiting > 1 ? 's' : ''} waiting` : '')
    : s.status === 'working' && s.activity ? h('div', {className: 'doing tool'}, s.activity)
    : h('div', {className: 'doing'}, (s.said || '').replace(/[#*`>|]/g, '').replace(/\s+/g, ' ').slice(0, 180));
  return h('article', {className: 'window ' + s.status, ariaLabel: `${titled(s)}: ${SAYS[s.status]}`},
    h('div', {className: 'name'},
      h('button', {className: 'open', onclick: () => show(s), title: s.title || ''}, titled(s)),
      h('button', {className: 'icon stop', onclick: () => stop(s), ariaLabel: 'Stop session', title: 'Stop'}, ICON.stop())),
    doing,
    h('div', {className: 'chips'}, ...items.map(chip(s))));
}

const unfolded = new Set();  // the projects whose ended sessions are unfolded, across redraws
function render() {
  const sig = JSON.stringify([state, plugins]);
  if (sig === drawn) return;
  drawn = sig;
  const live = id => state.sessions.find(s => s.run_id === id && s.exit === null);
  // The one session of a run that carries its items: the live one, else the latest.
  const holder = (path, id) => {
    const of = agents.filter(s => s.project === path && s.run_id === id);
    return of.find(s => s.exit === null) || of.pop();
  };
  const agents = state.sessions.filter(s => s.kind !== 'shell');  // terminals are not sessions
  const tiedTo = s => {
    const said = plugins[s.project];
    return (s.run_id && said && holder(s.project, s.run_id) === s ? runItems(said).filter(i => i.run_id === s.run_id) : []).concat(liveItems(s));
  };
  const urgency = {question: 0, working: 1, starting: 2, idle: 3};
  // The starter form is moved, not rebuilt: put the caret back where it was.
  const typing = document.activeElement?.closest?.('.starter') && document.activeElement;
  const caret = typing?.selectionStart !== undefined ? [typing.selectionStart, typing.selectionEnd] : null;

  // The left: each project's running sessions (the ones waiting on you first), its ended ones folded.
  const groups = state.projects.map(path => {
    const mine = agents.filter(s => s.project === path);
    const running = mine.filter(s => s.exit === null).sort((a, b) => urgency[a.status] - urgency[b.status] || b.started - a.started);
    const ended = mine.filter(s => s.exit !== null).reverse();
    if (!mine.length) return null;
    const fold = h('details', {className: 'ended', open: unfolded.has(path),
                               ontoggle: () => { fold.open ? unfolded.add(path) : unfolded.delete(path); }},
      h('summary', {}, `${ended.length} ended`),
      h('ul', {}, ...ended.map(s => {
        const play = h('button', {className: 'icon play', onclick: () => busy(play, () => start(path, 'resume', s.run_id)), ariaLabel: 'Resume session',
                                  title: 'Resume'}, ICON.play());
        return h('li', {},
          h('button', {className: 'session', onclick: () => show(s), title: s.title || ''},
            h('span', {className: 'lamp'}), h('span', {className: 'name'}, titled(s))),
          ...tiedTo(s).map(chip(s)),
          s.run_id && !live(s.run_id) ? play : '',
          h('button', {className: 'icon', onclick: () => remove(s), ariaLabel: 'Delete session', title: 'Delete'}, ICON.trash()));
      })));
    return h('div', {className: 'group'}, h('h3', {title: path}, name(path)),
      running.length ? h('div', {className: 'windows'}, ...running.map(s => windowOf(s, tiedTo(s)))) : '',
      ended.length ? fold : '');
  }).filter(Boolean);

  // The right: each project, its buttons, and what its plugins list (issues, …): the page only
  // draws it. An item a plugin tied to a run is on that run's session instead, while one is
  // listed; with none, it offers to resume the run. Items listed for runs only (pull requests)
  // show nowhere else.
  const projects = state.projects.map(path => {
    const said = plugins[path];
    const gear = h('button', {className: 'glyph', onclick: () => busy(gear, () => configure(path)), title: 'Settings', ariaLabel: 'Settings'}, ICON.gear());
    const shell = h('button', {className: 'glyph', onclick: () => busy(shell, () => terminal(path)), title: 'Terminal', ariaLabel: 'Terminal'}, ICON.prompt());
    const add = h('button', {className: 'glyph primary', onclick: () => busy(add, () => start(path, 'run')), title: 'New session', ariaLabel: 'New session'}, ICON.plus());
    return h('section', {className: 'project'},
      h('div', {className: 'head'}, h('h3', {title: path}, name(path), said?.agent ? h('small', {}, said.agent) : ''), gear, shell, add),
      h('div', {className: 'notes'},
        ...(said ? said.notes.map(note => h('p', {}, note)) : [h('p', {className: 'loading'}, h('span', {className: 'spin'}), 'Loading')])),
      ...(said ? said.lists : []).flatMap(list => {
        const items = list.items.filter(i => !(i.run_id && holder(path, i.run_id)));
        if (!items.length) return [];  // a list with nothing on it (no open issue) is not shown
        return [h('h4', {}, list.title, h('span', {className: 'count'}, String(items.length))),
          h('ul', {}, ...items.map(i => {
            const go = i.start && h('button', {onclick: () => busy(go, () => start(path, 'run', undefined, i.start.task)), title: i.start.task}, i.start.label);
            const again = i.run_id && h('button', {onclick: () => busy(again, () => start(path, 'resume', i.run_id))}, 'Resume');
            return h('li', {},
              h('a', {href: i.url, target: '_blank', rel: 'noopener', onclick: e => item(e, i), title: tip(i)},
                mark(i), i.ref ? h('span', {className: 'num'}, i.ref) : '',
                i.note ? h('span', {className: 'draft'}, i.note + ': ') : '', i.title),
              again || '',
              // A new session on a task the plugin wrote for this item (an issue's Resolve).
              go || '');
          }))];
      }));
  });

  $('board').replaceChildren(
    h('div', {className: 'top'}, state.projects.length ? starter() : h('div', {className: 'starter'}), themeSwitch()),
    state.projects.length ? h('div', {className: 'board'},
      h('div', {className: 'running'}, h('h2', {className: 'band'}, 'Running now'),
        agents.some(s => s.exit === null) ? '' : h('p', {className: 'none'}, 'Nothing running'), ...groups),
      h('aside', {className: 'projects'}, h('h2', {className: 'band'}, 'Projects'), ...projects))
    : h('div', {className: 'empty'}, h('b', {}, 'No projects yet'),
      `List the directories of the repos your agents work on, one per line, in ${state.projects_file}.`));
  if (typing) { typing.focus(); if (caret && typing.setSelectionRange) typing.setSelectionRange(...caret); }
}

async function load(path) {
  plugins[path] = await api('/api/project?project=' + encodeURIComponent(path)).catch(e => ({lists: [], notes: [e.message]}));
  render();
}

async function refresh() {
  const before = state.projects.join();
  state = await api('/api/state');
  if (state.projects.join() !== before) state.projects.forEach(load);
  render();
}

refresh();
setInterval(refresh, 3000);
setInterval(() => state.projects.forEach(load), 60000);
</script>
</body>
</html>
