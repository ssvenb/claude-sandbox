<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Session</title>
<link id="icon" rel="icon">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<style>
  /* A terminal: a project's shell on this machine (or an agent's own TUI, for a session started
     with "ui": "terminal"). An agent's session is otherwise a chat: see chat.html. */
  body { height: 100dvh; display: flex; flex-direction: column; background: var(--panel); }
  header { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--rule); background: var(--page); }
  header .home { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--muted); flex: none; }
  header .home:hover { color: var(--ink); background: var(--sunk); }
  header .home svg { width: 18px; height: 18px; }
  header strong { font-weight: 650; }
  header .what { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .what.lit { color: var(--lamp); }
  header .what.ask { color: var(--ask); }
  #stage { flex: 1; min-height: 0; position: relative; }
  #term { position: absolute; inset: 10px 6px 6px 14px; }
  #wait { position: absolute; inset: 0; display: grid; place-content: center; pointer-events: none; }
  #empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
           background: var(--panel); color: var(--muted); padding: 24px; }
  @media (max-width: 720px) { header { padding: 8px 10px; gap: 6px; } header .theme { display: none; } #term { inset: 6px 2px 2px 6px; } }
  #empty b { display: block; color: var(--ink); font-size: 22px; font-weight: 650; margin-bottom: 6px; }
</style>
</head>
<body>
<header id="bar"></header>
<div id="stage">
  <div id="term"></div>
  <div id="wait"><span class="loading"><span class="spin"></span>Connecting to the terminal</span></div>
  <div id="empty" hidden><div><b>Session gone</b><a href="/">Dashboard</a></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const id = location.hash.slice(1);
// The terminal wears the page's colours, by day and by night.
const palette = () => {
  const v = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  return {background: v('--panel'), foreground: v('--ink'), cursor: v('--lamp'), cursorAccent: v('--panel'),
          selectionBackground: v('--link') + '55'};
};
const term = new Terminal({fontSize: 13, cursorBlink: true, fontFamily: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
  theme: palette(), minimumContrastRatio: 4.5});
const repaint = () => { term.options.theme = palette(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);
document.addEventListener('themechange', repaint);
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($('term'));

// One POST at a time, batching what was typed meanwhile: parallel requests could arrive reordered.
let pending = '', sending = false;
async function flush() {
  if (sending || !pending) return;
  sending = true;
  const data = pending;
  pending = '';
  try { await fetch(`/api/sessions/${id}/input`, {method: 'POST', body: data}); } catch {}
  sending = false;
  flush();
}
term.onData(d => { pending += d; flush(); });

// Copy as in other terminals on the web: Ctrl+C copies when there is a selection (and interrupts
// as usual without one), Ctrl+Shift+C always copies. When the program takes the mouse (an agent's
// TUI does), Shift+drag still selects.
async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {  // no Clipboard API off localhost over plain http: the old way, through a textarea
    const area = h('textarea', {value: text});
    document.body.append(area);
    area.select();
    document.execCommand('copy');
    area.remove();
    term.focus();
  }
}
term.attachCustomKeyEventHandler(e => {
  // Ctrl+V pastes like Ctrl+Shift+V: left to the browser, whose paste the terminal takes in
  // (bracketed and all), instead of going on to the program as ^V.
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.code === 'KeyV') return false;
  const c = (e.ctrlKey || e.metaKey) && !e.altKey && e.code === 'KeyC';
  if (e.type !== 'keydown' || !c || !(e.shiftKey || term.hasSelection())) return true;
  e.preventDefault();
  if (term.hasSelection()) {  // copied, then let go: the next Ctrl+C is an interrupt again
    copy(term.getSelection());
    term.clearSelection();
  }
  return false;  // not to the program
});

function resize() {
  fit.fit();
  fetch(`/api/sessions/${id}/resize?cols=${term.cols}&rows=${term.rows}`, {method: 'POST'});
}
new ResizeObserver(resize).observe($('term'));

const es = new EventSource(`/api/sessions/${id}/stream`);
// The stream starts with the scrollback again after a reconnect, so start clean each time.
es.onopen = () => { term.reset(); resize(); $('wait').hidden = true; };
es.onmessage = e => term.write(Uint8Array.from(atob(e.data), c => c.charCodeAt(0)));
es.addEventListener('exit', () => { es.close(); refresh(); });
term.focus();

// Closing a session closes every tab of it: this one, and (told on `tabs`) the dashboard's
// handles on the rest.
const tabs = new BroadcastChannel('sandbox-tabs');
tabs.onmessage = e => {
  if (e.data.id === id) window.close();
};

// Closing this tab leaves the session running; only these buttons end it. Stop removes its
// container and keeps this tab, to read how it ended. Delete forgets it and closes its tabs.
async function stop(s) {
  const what = s.kind === 'shell' ? 'Stop this terminal?' : 'Stop this session?';
  if (!confirm(what)) return;
  await post(`/api/sessions/${s.id}/stop`).catch(e => alert(e.message));
  refresh();
}

async function remove(s) {
  const what = s.kind === 'shell' ? 'Stop and delete this terminal?' : 'Stop and delete this session?';
  if (s.exit === null && !confirm(what)) return;
  // What a plugin offers to tidy up with it (its run's open pull request: close it) is asked
  // about one by one, and done only on a yes.
  const {offers} = await api(`/api/sessions/${s.id}/offers`).catch(() => ({offers: []}));
  const tidy = offers.filter(o => confirm(o.ask)).map(o => o.url);
  const done = await post(`/api/sessions/${s.id}/delete`, JSON.stringify({tidy})).catch(e => alert(e.message));
  if (done?.failed?.length) alert('Not done:\n' + done.failed.join('\n'));
  tabs.postMessage(s);
  window.close();
  refresh();  // still here: this tab was not opened by the status page, so it may not close itself
}

let drawn = '';
async function refresh() {
  const s = (await api('/api/state')).sessions.find(s => s.id === id);
  $('empty').hidden = !!s;
  if (!s) {  // removed: nothing left to show
    es.close();
    window.close();
    return $('bar').replaceChildren(h('span', {className: 'what'}, 'No session'));
  }
  document.title = `${name(s.project)} ${label(s)}`;
  $('icon').href = FAVICON[s.kind === 'shell' ? 'shell' : s.status || 'unlit'];
  const sig = JSON.stringify(s);
  if (sig === drawn) return;  // a button under the pointer is not swapped out for its twin
  drawn = sig;
  $('bar').replaceChildren(
    h('a', {className: 'home', href: '/', target: 'sandbox-dashboard', title: 'Dashboard', ariaLabel: 'Dashboard'}, ICON.back()),
    h('strong', {}, name(s.project)),
    h('span', {className: 'what' + (s.exit === null ? ' lit' : '') + (s.status === 'question' ? ' ask' : '')},
      label(s) + (s.exit !== null ? `, exited ${s.exit}` : s.status ? ', ' + SAYS[s.status] : ', running')),
    s.exit === null ? h('button', {className: 'icon stop', onclick: () => stop(s), ariaLabel: 'Stop session'},
                        ICON.stop(), 'Stop') : '',
    h('button', {className: 'icon', onclick: () => remove(s), ariaLabel: 'Delete session'}, ICON.trash(), 'Delete'),
    themeSwitch());
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
